<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EV</title>
<style>
html,body,iframe{margin:0;width:100%;height:100%;border:0;padding:0;display:block;overflow:hidden;background:#08090b}
</style>
</head>
<body>
<div id="evFrameWrap" style="width:100%;height:100%;overflow:hidden;background:#08090b">
  <iframe id="evFrame" src="./EV-New-Memory-Fixed-iPhone-Zoom-Fixed-original.html?v=6" title="E.V."></iframe>
</div>
<script>
'use strict';

const frame=document.getElementById('evFrame');

frame.addEventListener('load',()=>{
  try{
    const win=frame.contentWindow;
    const doc=frame.contentDocument;

    /* Keep E.V.'s original design. Remove voice UI only. */
    const style=doc.createElement('style');
    style.id='ev-no-voice-style';
    style.textContent=`
      #voiceBtn,#voiceSelect,#micBtn,.controls-row:has(#voiceBtn),.controls-row:has(#voiceSelect){display:none!important;visibility:hidden!important;pointer-events:none!important;}
    `;
    doc.head.appendChild(style);

    const removeVoice=()=>{
      ['voiceBtn','voiceSelect','micBtn'].forEach(id=>{
        const el=doc.getElementById(id);
        if(el) el.remove();
      });
      doc.querySelectorAll('.controls-row').forEach(row=>{
        if(!row.textContent.trim()) row.remove();
      });
      try{if(win.speechSynthesis)win.speechSynthesis.cancel();}catch(_){}
    };
    removeVoice();
    const observer=new MutationObserver(removeVoice);
    observer.observe(doc.documentElement,{subtree:true,childList:true});

    const safeClip=(value,n)=>String(value||'').slice(-n);
    const textOf=(value)=>{
      if(typeof value==='string') return value;
      if(Array.isArray(value)) return value.map(part=>{
        if(part&&part.type==='text') return part.text||'';
        if(part&&(part.type==='image'||part.type==='image_url')) return '[photo attached]';
        return '';
      }).filter(Boolean).join('\n')||'[attachment]';
      return '';
    };

    async function requestGroq(messages,maxTokens){
      const key=typeof win.getGroqApiKey==='function'
        ? win.getGroqApiKey()
        : (win.localStorage.getItem('ev-groq-api-key')||'');
      if(!key) throw Object.assign(new Error('Groq API key is missing.'),{status:401});

      const response=await fetch('https://api.groq.com/openai/v1/chat/completions',{
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
        body:JSON.stringify({
          model:'openai/gpt-oss-120b',
          messages,
          max_completion_tokens:maxTokens,
          temperature:0.7,
          reasoning_effort:'low',
          include_reasoning:false
        })
      });
      const raw=await response.text().catch(()=> '');
      if(!response.ok){
        const err=new Error('Groq '+response.status+(raw?' — '+raw:''));
        err.status=response.status;
        throw err;
      }
      return JSON.parse(raw);
    }

    function compactMessages(currentText){
      const h=Array.isArray(win.history)?win.history:[];
      let system='You are E.V., a warm, helpful personal AI assistant. Keep replies natural and concise.';
      try{if(typeof win.BASE_SYSTEM_PROMPT==='string')system=safeClip(win.BASE_SYSTEM_PROMPT,2200);}catch(_){}
      try{if(typeof win.timeContext==='function')system+='\n\n'+safeClip(win.timeContext(),500);}catch(_){}
      try{if(typeof win.agendaContext==='function')system+='\n\n'+safeClip(win.agendaContext(),600);}catch(_){}
      try{if(typeof win.memoryContext==='function')system+='\n\n'+safeClip(win.memoryContext(),700);}catch(_){}
      try{if(typeof win.adjustmentsContext==='function')system+='\n\n'+safeClip(win.adjustmentsContext(),400);}catch(_){}

      const messages=[{role:'system',content:safeClip(system,4200)}];
      const recent=[];
      for(let i=h.length-1;i>=0&&recent.length<4;i--){
        const m=h[i];
        if(!m||(m.role!=='user'&&m.role!=='assistant'))continue;
        const content=safeClip(textOf(m.content).trim(),450);
        if(content)recent.unshift({role:m.role,content});
      }
      const current=safeClip(currentText,450);
      if(!recent.length||recent[recent.length-1].role!=='user'||recent[recent.length-1].content!==current){
        recent.push({role:'user',content:current});
      }
      for(const m of recent)messages.push(m);
      return messages;
    }

    async function safeSend(text){
      const message=String(text||'').trim();
      if(!message||win.__evSafeBusy)return;
      win.__evSafeBusy=true;
      const send=doc.getElementById('send');
      const input=doc.getElementById('input');
      if(send)send.disabled=true;

      if(!Array.isArray(win.history))win.history=[];
      win.history.push({role:'user',content:message});
      let bubble=null;
      try{
        win.vizState='thinking';
        bubble=typeof win.addThinkingRow==='function'?win.addThinkingRow():null;

        let data;
        try{
          data=await requestGroq(compactMessages(message),260);
        }catch(first){
          if(first&&first.status===413){
            data=await requestGroq([
              {role:'system',content:'You are E.V. Reply briefly and directly to the user.'},
              {role:'user',content:safeClip(message,250)}
            ],120);
          }else throw first;
        }

        const raw=data?.choices?.[0]?.message?.content||'(no response)';
        let reply=String(raw).trim();
        try{
          reply=win.extractSimulationTags(
            win.extractProposalTags(
              win.extractMemoryTags(reply,doc.getElementById('log')),
              doc.getElementById('log')
            ),
            doc.getElementById('log')
          );
        }catch(_){}

        if(bubble){
          bubble.classList.remove('thinking');
          bubble.innerHTML=typeof win.linkify==='function'
            ?win.linkify(reply)
            :reply.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
        }
        win.history.push({role:'assistant',content:reply});
        try{
          if(typeof win.storageSet==='function'&&typeof win.sanitizeHistoryForStorage==='function')
            await win.storageSet('ev-history',win.sanitizeHistoryForStorage(win.history));
        }catch(_){}
        try{win.linkStatus.textContent='LINK ACTIVE';}catch(_){}
        try{win.statModel.textContent='gpt-oss-120b';}catch(_){}
        try{if(typeof win.buildTicker==='function')win.buildTicker();}catch(_){}
        try{win.vizState='idle';}catch(_){}
        try{if(typeof win.scrollToEnd==='function')win.scrollToEnd();}catch(_){}
      }catch(err){
        console.error('E.V. fixed sender error',err);
        if(bubble){
          bubble.classList.remove('thinking');
          bubble.textContent=err?.status===413
            ?'E.V. request was too large. The old chat was not sent.'
            :err?.status===401
              ?'E.V. needs her Groq API key. Enter it when prompted.'
              :'E.V. connection failed. Please try again.';
        }
        try{win.vizState='idle';}catch(_){}
      }finally{
        win.__evSafeBusy=false;
        if(send)send.disabled=false;
        if(input)input.focus();
        removeVoice();
      }
    }

    /* IMPORTANT: the original page's submit listener closes over its own
       sendMessage function, so replacing window.sendMessage is not enough.
       Capture the submit event first and stop the broken original handler. */
    const form=doc.getElementById('composer');
    if(form){
      form.addEventListener('submit',(e)=>{
        e.preventDefault();
        e.stopImmediatePropagation();
        const input=doc.getElementById('input');
        const text=input?input.value.trim():'';
        if(!text)return;
        if(typeof win.addRow==='function')win.addRow('user',text,null,null);
        if(input){input.value='';input.style.height='auto';}
        safeSend(text);
      },true);
    }

    /* Block the old mic even if another script tries to recreate it. */
    doc.addEventListener('click',(e)=>{
      const t=e.target;
      if(t&&(t.id==='micBtn'||t.id==='voiceBtn')){
        e.preventDefault();
        e.stopImmediatePropagation();
        removeVoice();
      }
    },true);

    removeVoice();
  }catch(err){
    console.error('E.V. patch failed',err);
  }
});
</script>
</body>
</html>
