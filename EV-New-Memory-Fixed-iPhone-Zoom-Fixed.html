<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EV</title>
<style>
html,body,iframe{margin:0;width:100%;height:100%;border:0;padding:0;display:block;overflow:hidden;background:#08090b}
</style>
</head>
<body>
<div id="evFrameWrap" style="width:100%;height:100%;overflow:hidden;background:#08090b">
  <iframe id="evFrame" src="./EV-New-Memory-Fixed-iPhone-Zoom-Fixed-original.html?v=10" title="E.V."></iframe>
</div>
<script>
'use strict';
const frame=document.getElementById('evFrame');
frame.addEventListener('load',()=>{
  try{
    const win=frame.contentWindow, doc=frame.contentDocument;
    const input=doc.getElementById('input'), send=doc.getElementById('send');

    /* Keep E.V.'s original interface, personality, voice, memory, agenda,
       weather/search updates, and response behavior. Only remove the old
       microphone input / wake-word control that was causing the iPhone issues. */
    const style=doc.createElement('style');
    style.textContent='#micBtn{display:none!important;visibility:hidden!important;pointer-events:none!important}';
    doc.head.appendChild(style);
    const removeMic=()=>{const e=doc.getElementById('micBtn');if(e)e.remove();};
    removeMic();

    /* Keep the original sender and original BASE_SYSTEM_PROMPT intact.
       Trim only the oldest conversation turns in outgoing Groq requests so
       repeated messages do not eventually hit Groq's 413 payload limit.
       If the newest user turn contains a photo, switch that one request to
       Groq's vision-capable Llama 4 Scout model and pass the actual image. */
    const originalFetch=win.fetch.bind(win);
    win.fetch=async function(url, options={}){
      try{
        const target=typeof url==='string' ? url : (url && url.url) || '';
        if(target.includes('api.groq.com/openai/v1/chat/completions') && options && typeof options.body==='string'){
          const payload=JSON.parse(options.body);
          if(Array.isArray(payload.messages)){
            const system=payload.messages[0];
            const recent=payload.messages.slice(1).slice(-8);
            payload.messages=[system,...recent];

            const lastUserIndex=payload.messages.map(m=>m.role).lastIndexOf('user');
            if(lastUserIndex>0){
              const lastUser=payload.messages[lastUserIndex];
              const photoRows=[...doc.querySelectorAll('.row.user img.chat-img')];
              const lastPhoto=photoRows.length ? photoRows[photoRows.length-1] : null;
              const text=typeof lastUser.content==='string' ? lastUser.content : '';
              if(lastPhoto && /\(sent a photo\)|photo attached|what do you see in this photo/i.test(text)){
                const dataUrl=lastPhoto.src;
                payload.model='meta-llama/llama-4-scout-17b-16e-instruct';
                payload.messages[lastUserIndex]={
                  role:'user',
                  content:[
                    {type:'text',text:text.replace(/^\(sent a photo\)$/, 'What do you see in this photo?')},
                    {type:'image_url',image_url:{url:dataUrl}}
                  ]
                };
                payload.max_completion_tokens=Math.min(Number(payload.max_completion_tokens)||800,800);
              }
            }
            options={...options,body:JSON.stringify(payload)};
          }
        }
      }catch(err){console.warn('E.V. request compatibility patch skipped:',err);}
      return originalFetch(url,options);
    };

    /* Jarvis-style layer: text commands only. Normal E.V. chat is untouched. */
    const jarvis=doc.createElement('script');
    jarvis.src='./ev-jarvis-layer.js?v=1';
    jarvis.async=false;
    doc.body.appendChild(jarvis);

    if(send) send.addEventListener('click',()=>removeMic(),true);
    if(input) input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey)removeMic();},true);
    removeMic();
  }catch(err){console.error('E.V. compatibility patch failed',err);}
});
</script>
</body>
</html>
