<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EV</title>
<style>html,body,iframe{margin:0;width:100%;height:100%;border:0;padding:0;display:block;overflow:hidden;background:#08090b}</style>
</head>
<body>
<div id="evFrameWrap" style="width:100%;height:100%;overflow:hidden;background:#08090b">
  <iframe id="evFrame" src="./EV-New-Memory-Fixed-iPhone-Zoom-Fixed-original.html" title="E.V."></iframe>
</div>
<script>
const PATCH = String.raw`(function(){
  const form=document.getElementById('composer'), input=document.getElementById('input'), sendBtn=document.getElementById('send'), log=document.getElementById('log');
  if(!form||!input||!sendBtn||!log) return;
  let busy=false;

  function textOf(c){
    if(typeof c==='string') return c;
    if(Array.isArray(c)) return c.map(x=>x&&x.type==='text'?x.text||'':x&&(x.type==='image'||x.type==='image_url')?'[photo attached]':'').filter(Boolean).join('\\n')||'[attachment]';
    return '';
  }

  function clip(s,n){ s=String(s||''); return s.length>n?s.slice(-n):s; }
  function safeMessages(systemPrompt,currentText){
    const out=[{role:'system',content:clip(systemPrompt,6500)}];
    const recent=[];
    for(let i=history.length-1;i>=0 && recent.length<8;i--){
      const m=history[i];
      if(m.role!=='user'&&m.role!=='assistant') continue;
      const content=clip(textOf(m.content).trim(),900);
      if(content) recent.unshift({role:m.role,content});
    }
    const lastUser=recent.length?recent[recent.length-1]:null;
    if(lastUser && lastUser.role==='user' && lastUser.content===clip(currentText,900)) recent.pop();
    for(const m of recent){
      const last=out[out.length-1];
      if(last.role===m.role) last.content+='\\n'+m.content; else out.push(m);
    }
    out.push({role:'user',content:clip(currentText,900)});
    return out;
  }

  async function safeCall(systemPrompt,currentText){
    const key=getGroqApiKey(); if(!key) throw new Error('Groq API key is missing');
    const res=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({model:GROQ_MODEL,messages:safeMessages(systemPrompt,currentText),max_completion_tokens:900,temperature:.7,reasoning_effort:'low'})});
    if(!res.ok){const d=await res.text().catch(()=> ''); const e=new Error('Groq '+res.status+(d?' — '+d:'')); e.status=res.status; throw e;}
    return res.json();
  }

  async function safeSend(text){
    if(busy) return; busy=true; sendBtn.disabled=true;
    history.push({role:'user',content:text});
    const bubble=addThinkingRow();
    try{
      const ctx=BASE_SYSTEM_PROMPT+'\\n\\n'+timeContext()+'\\n\\n'+agendaContext()+'\\n\\n'+memoryContext()+'\\n\\n'+adjustmentsContext();
      let data;
      try{ data=await safeCall(ctx,text); }
      catch(firstErr){
        if(firstErr&&(firstErr.status===400||firstErr.status===413||firstErr.status===422)){
          const key=getGroqApiKey();
          const compactSystem=clip(BASE_SYSTEM_PROMPT,3500)+'\\n'+clip(timeContext(),900)+'\\n'+clip(memoryContext(),1200);
          const res=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({model:GROQ_MODEL,messages:[{role:'system',content:compactSystem},{role:'user',content:clip(text,700)}],max_completion_tokens:700,temperature:.7,reasoning_effort:'low'})});
          if(!res.ok){const d=await res.text().catch(()=> ''); const e=new Error('Groq '+res.status+(d?' — '+d:'')); e.status=res.status; throw e;} data=await res.json();
        }else throw firstErr;
      }
      const raw=data?.choices?.[0]?.message?.content||'(no response)';
      const reply=extractSimulationTags(extractProposalTags(extractMemoryTags(raw.trim()),log),log);
      bubble.classList.remove('thinking'); bubble.innerHTML=linkify(reply);
      if(typeof speak==='function') { try { speak(''); } catch(_){} }
      history.push({role:'assistant',content:reply}); storageSet('ev-history',sanitizeHistoryForStorage(history)); scrollToEnd();
    }catch(err){
      console.error(err); bubble.classList.remove('thinking');
      bubble.textContent=err?.status===429?'Groq is rate-limiting E.V. for a moment. Try again in a few seconds.':'E.V. connection failed ('+(err?.status||'network')+'). Your message is still in the chat.'; scrollToEnd();
    }finally{ busy=false; sendBtn.disabled=false; input.focus(); }
  }

  window.EVSend = safeSend;
  form.addEventListener('submit',function(e){
    e.preventDefault(); e.stopImmediatePropagation();
    const text=input.value.trim(); if(!text||busy)return;
    addRow('user',text); input.value=''; input.style.height='auto'; safeSend(text);
  },true);
})();`;

const frame=document.getElementById('evFrame');
frame.addEventListener('load',()=>{
  try{
    const doc=frame.contentDocument;

    // Keep all non-voice E.V. features, but remove voice control completely.
    const voiceOff=doc.createElement('style');
    voiceOff.textContent=`#voiceBtn,#voiceSelect,#micBtn{display:none!important;} #statVoice{font-size:0;} #statVoice::after{content:'off';font-size:inherit;}`;
    doc.head.appendChild(voiceOff);

    const features=doc.createElement('script');
    features.src='./ev-features.js?v=4';
    doc.body.appendChild(features);

    const voiceDisable=doc.createElement('script');
    voiceDisable.textContent=`(function(){
      try{
        window.EVWake={supported:()=>false,enabled:()=>false,enable:()=>false,disable:()=>{},restart:()=>{}};
        window.speak=function(){};
        const oldSpeak=window.speechSynthesis&&window.speechSynthesis.speak;
        if(window.speechSynthesis) window.speechSynthesis.speak=function(){};
        const oldSpeech=window.SpeechRecognition||window.webkitSpeechRecognition;
        try{ window.SpeechRecognition=undefined; window.webkitSpeechRecognition=undefined; }catch(_){}
        const stopVoice=()=>{try{window.speechSynthesis?.cancel();}catch(_){} try{window.EVWake?.disable();}catch(_){} };
        stopVoice();
        document.addEventListener('click',e=>{if(e.target?.id==='voiceBtn'||e.target?.id==='micBtn')e.preventDefault();},true);
      }catch(_){}
    })();`;
    doc.body.appendChild(voiceDisable);

    const s=doc.createElement('script');
    s.textContent=PATCH;
    doc.body.appendChild(s);
  }catch(e){ console.error('E.V. patch injection failed',e); }
});
</script>
</body>
</html>
