<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>EV</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0;padding:0;display:block;overflow:hidden;background:#08090b}</style></head><body><div id="evFrameWrap" style="width:100%;height:100%;overflow:hidden;background:#08090b"><iframe id="evFrame" src="./EV-New-Memory-Fixed-iPhone-Zoom-Fixed-original.html?v=13" title="E.V." allow="microphone"></iframe></div><script>
'use strict';
const frame=document.getElementById('evFrame');
frame.addEventListener('load',()=>{try{const win=frame.contentWindow,doc=frame.contentDocument,input=doc.getElementById('input'),send=doc.getElementById('send');
const style=doc.createElement('style');style.textContent='#micBtn{display:none!important}';doc.head.appendChild(style);const removeMic=()=>{const e=doc.getElementById('micBtn');if(e)e.remove()};removeMic();
function compressImage(dataUrl,maxSide=720,quality=.45){return new Promise(resolve=>{if(!dataUrl||!dataUrl.startsWith('data:image/'))return resolve(dataUrl);const img=new Image();img.onload=()=>{try{const iw=img.naturalWidth||img.width,ih=img.naturalHeight||img.height,s=Math.min(1,maxSide/Math.max(iw,ih)),w=Math.max(1,Math.round(iw*s)),h=Math.max(1,Math.round(ih*s)),c=doc.createElement('canvas');c.width=w;c.height=h;c.getContext('2d',{alpha:false}).drawImage(img,0,0,w,h);resolve(c.toDataURL('image/jpeg',quality))}catch(_){resolve(dataUrl)}};img.onerror=()=>resolve(dataUrl);img.src=dataUrl})}
const originalFetch=win.fetch.bind(win);win.fetch=async function(url,options={}){const target=typeof url==='string'?url:(url&&url.url)||'';if(!target.includes('api.groq.com/openai/v1/chat/completions')||!options||typeof options.body!=='string')return originalFetch(url,options);let p;try{p=JSON.parse(options.body)}catch(_){return originalFetch(url,options)}if(!Array.isArray(p.messages))return originalFetch(url,options);const system=p.messages[0];p.messages=[system,...p.messages.slice(1).slice(-4)];p.max_completion_tokens=Math.min(Number(p.max_completion_tokens)||900,900);const rows=[...doc.querySelectorAll('.row.user')],last=rows.length?rows[rows.length-1]:null,photo=last?last.querySelector('img.chat-img'):null,idx=p.messages.map(m=>m.role).lastIndexOf('user');if(idx>0&&photo&&photo.src){const u=p.messages[idx],txt=typeof u.content==='string'?u.content.replace(/^\[photo attached\]\s*/i,'').trim():'';p.model='qwen/qwen3.6-27b';p.messages[idx]={role:'user',content:[{type:'text',text:txt||'Please look at this image and tell me what you see.'},{type:'image_url',image_url:{url:await compressImage(photo.src,720,.45)}}]};p.max_completion_tokens=500}return originalFetch(url,{...options,body:JSON.stringify(p)})};
const jarvis=doc.createElement('script');jarvis.src='./ev-jarvis-layer.js?v=5';jarvis.async=false;doc.body.appendChild(jarvis);
const mic=doc.createElement('button');mic.id='evListenToggle';mic.type='button';mic.textContent='🎙️ E.V. Listening: OFF';mic.style.cssText='position:fixed;z-index:99999;right:12px;top:calc(env(safe-area-inset-top) + 12px);padding:10px 12px;border:1px solid rgba(255,255,255,.2);border-radius:14px;background:#171a20;color:#fff;font:600 13px system-ui;box-shadow:0 6px 20px rgba(0,0,0,.3)';doc.body.appendChild(mic);
const SR=win.SpeechRecognition||win.webkitSpeechRecognition;if(!SR){mic.textContent='🎙️ Voice unavailable';mic.disabled=true;return}
let listening=false,armed=false,rec=null,restarting=false;
function state(on,label){listening=on;mic.textContent=label||(on?'🎙️ E.V. Listening: ON':'🎙️ E.V. Listening: OFF')}
function submit(t){t=String(t||'').trim();if(!t||!input)return;input.value=t;input.dispatchEvent(new Event('input',{bubbles:true}));if(send)send.click();else input.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',code:'Enter',bubbles:true}))}
function start(){if(!listening||!rec||restarting)return;try{rec.start()}catch(_){} }
function build(){rec=new SR();rec.lang='en-US';rec.continuous=false;rec.interimResults=false;rec.maxAlternatives=1;rec.onresult=e=>{const heard=String(e.results?.[0]?.[0]?.transcript||'').trim();if(!heard)return;const wake=heard.match(/^e\.?v\.?\s*(.*)$/i);if(wake){const cmd=wake[1].trim();if(cmd){armed=false;submit(cmd)}else{armed=true;state(true,'🎙️ Listening for command…')}}else if(armed){armed=false;submit(heard)}};rec.onerror=e=>{restarting=false;if(e.error==='not-allowed'||e.error==='service-not-allowed'){state(false,'🎙️ Microphone blocked');listening=false}else if(listening){setTimeout(start,500)}};rec.onend=()=>{restarting=false;if(listening)setTimeout(start,350)}}
mic.addEventListener('click',async()=>{if(listening){state(false);armed=false;try{rec&&rec.stop()}catch(_){}return}build();state(true,'🎙️ E.V. Listening: ON');try{await win.navigator.mediaDevices.getUserMedia({audio:true})}catch(_){state(false,'🎙️ Microphone blocked');return}start()});
if(send)send.addEventListener('click',removeMic,true);if(input)input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey)removeMic(),true});removeMic();
}catch(err){console.error('E.V. compatibility patch failed',err)}});
</script></body></html>
