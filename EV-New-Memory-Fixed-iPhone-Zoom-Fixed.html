<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>EV</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0;padding:0;display:block;overflow:hidden;background:#08090b}</style></head><body><div id="evFrameWrap" style="width:100%;height:100%;overflow:hidden;background:#08090b"><iframe id="evFrame" src="./EV-New-Memory-Fixed-iPhone-Zoom-Fixed-original.html?v=14" title="E.V." allow="microphone"></iframe></div><script>
'use strict';
const frame=document.getElementById('evFrame');
frame.addEventListener('load',()=>{try{const win=frame.contentWindow,doc=frame.contentDocument,input=doc.getElementById('input'),send=doc.getElementById('send');
const style=doc.createElement('style');style.textContent='#micBtn{display:none!important}';doc.head.appendChild(style);const removeMic=()=>{const e=doc.getElementById('micBtn');if(e)e.remove()};removeMic();
function compressImage(dataUrl,maxSide=900,quality=.55){return new Promise(resolve=>{if(!dataUrl||!dataUrl.startsWith('data:image/'))return resolve(dataUrl);const img=new Image();img.onload=()=>{try{const iw=img.naturalWidth||img.width,ih=img.naturalHeight||img.height,s=Math.min(1,maxSide/Math.max(iw,ih)),w=Math.max(1,Math.round(iw*s)),h=Math.max(1,Math.round(ih*s)),c=doc.createElement('canvas');c.width=w;c.height=h;c.getContext('2d',{alpha:false}).drawImage(img,0,0,w,h);resolve(c.toDataURL('image/jpeg',quality))}catch(_){resolve(dataUrl)}};img.onerror=()=>resolve(dataUrl);img.src=dataUrl})}
const originalFetch=win.fetch.bind(win);win.fetch=async function(url,options={}){const target=typeof url==='string'?url:(url&&url.url)||'';if(!target.includes('api.groq.com/openai/v1/chat/completions')||!options||typeof options.body!=='string')return originalFetch(url,options);let p;try{p=JSON.parse(options.body)}catch(_){return originalFetch(url,options)}if(!Array.isArray(p.messages))return originalFetch(url,options);const system=p.messages[0];p.messages=[system,...p.messages.slice(1).slice(-6)];p.max_completion_tokens=Math.min(Number(p.max_completion_tokens)||900,900);const rows=[...doc.querySelectorAll('.row.user')],last=rows.length?rows[rows.length-1]:null,photo=last?last.querySelector('img.chat-img'):null,idx=p.messages.map(m=>m.role).lastIndexOf('user');if(idx>0&&photo&&photo.src){const u=p.messages[idx],txt=typeof u.content==='string'?u.content.replace(/^\[photo attached\]\s*/i,'').trim():'';p.model='qwen/qwen3.6-27b';p.messages[idx]={role:'user',content:[{type:'text',text:txt||'Analyze this image carefully. Describe what is visible and answer the user question about it.'},{type:'image_url',image_url:{url:await compressImage(photo.src)}}]};p.max_completion_tokens=700}return originalFetch(url,{...options,body:JSON.stringify(p)})};
const jarvis=doc.createElement('script');jarvis.src='./ev-jarvis-layer.js?v=8';jarvis.async=false;doc.body.appendChild(jarvis);
const voiceFix=doc.createElement('script');voiceFix.src='./ev-voice-fix.js?v=1';voiceFix.async=false;doc.body.appendChild(voiceFix);
const mic=doc.createElement('button');mic.id='evListenToggle';mic.type='button';mic.textContent='🎙️ Wake word: OFF';mic.style.cssText='position:fixed;z-index:99999;right:12px;top:calc(env(safe-area-inset-top) + 12px);padding:10px 12px;border:1px solid rgba(255,255,255,.2);border-radius:14px;background:#171a20;color:#fff;font:600 13px system-ui;box-shadow:0 6px 20px rgba(0,0,0,.3)';doc.body.appendChild(mic);
const voice=doc.createElement('button');voice.id='evVoiceReply';voice.type='button';voice.textContent='🔊 Voice replies: ON';voice.style.cssText='position:fixed;z-index:99999;right:12px;top:calc(env(safe-area-inset-top) + 58px);padding:9px 12px;border:1px solid rgba(255,255,255,.2);border-radius:14px;background:#171a20;color:#fff;font:600 12px system-ui;box-shadow:0 6px 20px rgba(0,0,0,.25)';doc.body.appendChild(voice);
const dash=doc.createElement('button');dash.id='evDashboard';dash.type='button';dash.textContent='⚡ JARVIS';dash.style.cssText='position:fixed;z-index:99999;left:12px;top:calc(env(safe-area-inset-top) + 12px);padding:10px 12px;border:1px solid rgba(255,255,255,.2);border-radius:14px;background:#171a20;color:#fff;font:700 13px system-ui;box-shadow:0 6px 20px rgba(0,0,0,.3)';doc.body.appendChild(dash);
const panel=doc.createElement('div');panel.id='evDashPanel';panel.style.cssText='display:none;position:fixed;z-index:100000;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 58px);max-height:70vh;overflow:auto;padding:16px;border:1px solid rgba(255,255,255,.16);border-radius:18px;background:rgba(15,17,21,.97);color:#fff;font:14px system-ui;box-shadow:0 15px 40px rgba(0,0,0,.45)';panel.innerHTML='<div style="font-size:18px;font-weight:800;margin-bottom:12px">E.V. JARVIS STATUS</div><div id="evDashContent">Loading systems…</div><button id="evDashClose" style="margin-top:14px;padding:9px 12px;border-radius:10px;border:0;background:#2a2f38;color:#fff">Close</button>';doc.body.appendChild(panel);
function refreshDash(){const mem=(()=>{try{return JSON.parse(win.localStorage.getItem('ev-personal-memory-v1')||'[]').length}catch(_){return 0}})();const rem=(()=>{try{return JSON.parse(win.localStorage.getItem('ev-reminders-v1')||'[]').filter(x=>new Date(x.when)>new Date()).length}catch(_){return 0}})();const notes=(()=>{try{return JSON.parse(win.localStorage.getItem('ev-notes-v1')||'[]').length}catch(_){return 0}})();const agenda=Array.isArray(win.agenda)?win.agenda.length:0;panel.querySelector('#evDashContent').innerHTML='<div style="line-height:1.8">🧠 Memory: <b>'+mem+'</b> saved<br>🔔 Upcoming reminders: <b>'+rem+'</b><br>📅 Agenda items: <b>'+agenda+'</b><br>📝 Notes: <b>'+notes+'</b><br>🎙️ Voice input: <b>'+ (mic.textContent.includes('ON')?'Wake word active':'Tap to speak available') +'</b><br>🔊 Voice replies: <b>'+ (voice.textContent.includes('ON')?'ON':'OFF') +'</b><br>📸 Image vision: <b>READY</b><br>⚡ Core: <b>ONLINE</b></div>'}
dash.addEventListener('click',()=>{panel.style.display=panel.style.display==='none'?'block':'none';refreshDash()});panel.querySelector('#evDashClose').addEventListener('click',()=>panel.style.display='none');
let voiceReplies=true;voice.addEventListener('click',()=>{voiceReplies=!voiceReplies;voice.textContent=voiceReplies?'🔊 Voice replies: ON':'🔇 Voice replies: OFF';try{win.localStorage.setItem('ev-voice-replies',voiceReplies?'1':'0')}catch(_){} });try{voiceReplies=win.localStorage.getItem('ev-voice-replies')!=='0';voice.textContent=voiceReplies?'🔊 Voice replies: ON':'🔇 Voice replies: OFF'}catch(_){}
const SR=win.SpeechRecognition||win.webkitSpeechRecognition;if(!SR){mic.textContent='🎙️ Tap to speak';mic.disabled=false}else{let active=false,armed=false,rec=null,restartTimer=null;function state(text){mic.textContent=text;refreshDash()}function submit(t){t=String(t||'').trim();if(!t||!input)return;input.value=t;input.dispatchEvent(new Event('input',{bubbles:true}));if(send)send.click();else input.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',code:'Enter',bubbles:true}))}function startWake(){if(!active||!rec)return;try{rec.start()}catch(_){} }function build(){rec=new SR();rec.lang='en-US';rec.continuous=true;rec.interimResults=false;rec.maxAlternatives=1;rec.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++){const heard=String(e.results[i]?.[0]?.transcript||'').trim();if(!heard)continue;const wake=heard.match(/^e\.?v\.?\s*(.*)$/i);if(wake){const command=wake[1].trim();if(command){armed=false;submit(command)}else{armed=true;state('🎙️ E.V. is listening…')}}else if(armed){armed=false;submit(heard)}}};rec.onerror=e=>{if(!active)return;if(e.error==='not-allowed'||e.error==='service-not-allowed'){active=false;state('🎙️ Microphone blocked');return}clearTimeout(restartTimer);restartTimer=setTimeout(startWake,900)};rec.onend=()=>{if(!active)return;clearTimeout(restartTimer);restartTimer=setTimeout(startWake,700)}}async function enable(){try{await win.navigator.mediaDevices.getUserMedia({audio:true})}catch(_){state('🎙️ Microphone blocked');return}active=true;armed=false;build();state('🎙️ Wake word: ON');startWake()}function disable(){active=false;armed=false;clearTimeout(restartTimer);try{rec&&rec.stop()}catch(_){}state('🎙️ Wake word: OFF')}mic.addEventListener('click',()=>{if(active)disable();else enable()})}
if(send)send.addEventListener('click',removeMic,true);if(input)input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey)removeMic()},true);removeMic();
}catch(err){console.error('E.V. compatibility patch failed',err)}});
</script></body></html>
