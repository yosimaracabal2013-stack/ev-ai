<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#02070c">
<title>E.V. // CORE</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02070c;color:#d8eef4;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;-webkit-text-size-adjust:100%}#engine{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:0;background:#02070c}#evUI{position:fixed;inset:0;z-index:5;display:grid;grid-template-rows:auto 1fr auto;padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom);pointer-events:none;background:linear-gradient(rgba(2,7,12,.94),rgba(2,7,12,.35) 20%,rgba(2,7,12,.18) 70%,rgba(2,7,12,.96));}#top{display:flex;align-items:center;justify-content:space-between;min-height:52px;border-bottom:1px solid #0d3041;pointer-events:auto}.brand{font-size:12px;letter-spacing:3px;color:#52e6a0}.brand small{color:#628391;font-size:8px}.clock{text-align:right;color:#36d8ff;font-size:9px;line-height:1.35}.clock small{display:block;color:#628391;font-size:7px}.center{min-height:0;position:relative;display:grid;place-items:center}.core{width:min(45vw,270px);height:min(45vw,270px);border:1px solid rgba(54,216,255,.24);border-radius:50%;display:grid;place-items:center;position:relative;animation:spin 20s linear infinite}.core:before,.core:after{content:"";position:absolute;border:1px dashed rgba(82,230,160,.22);border-radius:50%;inset:10%;}.core:after{inset:22%;border-style:solid;animation:spin 12s linear infinite reverse}.orb{width:34%;height:34%;border:2px solid #52e6a0;border-radius:50%;box-shadow:0 0 28px rgba(82,230,160,.28),inset 0 0 22px rgba(82,230,160,.15);animation:pulse 2.2s ease-in-out infinite}.coreLabel{position:absolute;bottom:7%;font-size:8px;letter-spacing:2px;color:#628391;animation:none}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{transform:scale(1.08);filter:brightness(1.2)}}#feed{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);width:min(84vw,520px);max-height:31%;overflow:auto;display:flex;flex-direction:column;gap:6px}.msg{padding:7px 9px;background:rgba(3,13,20,.9);border-left:2px solid #52e6a0;font-size:9px;line-height:1.45;animation:slide .25s ease}.msg.user{border-left-color:#36d8ff}@keyframes slide{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}#bottom{padding:7px 0 calc(7px + env(safe-area-inset-bottom));border-top:1px solid #0d3041;pointer-events:auto;background:linear-gradient(transparent,rgba(2,7,12,.98) 18%)}#status{text-align:center;color:#628391;font-size:7px;letter-spacing:1px;margin-bottom:6px}.composer{display:flex;gap:6px}.composer input{flex:1;min-width:0;height:43px;border:1px solid #0d3041;background:rgba(3,13,20,.94);color:#d8eef4;border-radius:7px;padding:0 11px;font:11px ui-monospace;outline:0}.composer button{height:43px;border:1px solid #0d3041;background:#031019;color:#36d8ff;border-radius:7px;padding:0 10px;font:8px ui-monospace;letter-spacing:1px}.composer button:active{transform:scale(.97)}#windows{position:fixed;inset:0;z-index:20;pointer-events:none}.win{position:absolute;left:50%;top:12%;width:min(88vw,430px);max-height:72vh;overflow:hidden;background:rgba(3,12,18,.98);border:1px solid rgba(54,216,255,.42);border-radius:12px;box-shadow:0 24px 80px rgba(0,0,0,.7);pointer-events:auto;opacity:0;transform:translate(-50%,15px) scale(.98);transition:.25s}.win.show{opacity:1;transform:translate(-50%,0) scale(1)}.wh{height:43px;display:flex;align-items:center;padding:0 10px;gap:8px;border-bottom:1px solid #0d3041;touch-action:none;user-select:none}.dot{width:6px;height:6px;border-radius:50%;background:#52e6a0;box-shadow:0 0 10px #52e6a0}.wt{font-size:8px;letter-spacing:2px;color:#d8eef4}.wc{margin-left:auto;background:0;border:0;color:#628391;font-size:20px}.wb{padding:12px;overflow:auto;max-height:calc(72vh - 43px);font-size:10px;line-height:1.55}.wb button{background:#041721;border:1px solid #0d3041;color:#36d8ff;border-radius:6px;padding:7px 9px;margin:4px 4px 0 0;font:8px ui-monospace}.wb textarea{width:100%;min-height:110px;background:#031018;color:#d8eef4;border:1px solid #0d3041;border-radius:7px;padding:9px;font:10px ui-monospace}@media(max-width:700px){.core{width:min(56vw,230px);height:min(56vw,230px)}.brand{font-size:10px}.brand small{font-size:7px}#feed{width:88%;max-height:25%}}@media(orientation:landscape) and (max-height:520px){#top{min-height:42px}.core{width:min(31vh,180px);height:min(31vh,180px)}#feed{bottom:2%;max-height:27%;width:70%}#bottom{padding-top:4px}.composer input,.composer button{height:36px}.center{padding:0 80px}}
</style></head>
<body>
<iframe id="engine" src="./EV-New-Memory-Fixed-iPhone-Zoom-Fixed-original.html?v=direct77" allow="microphone;camera;geolocation"></iframe>
<div id="evUI">
<header id="top"><div class="brand">E.V. <small>// CORE</small></div><div class="clock" id="clock">--:--:--<small>LOCAL TIME</small></div></header>
<main class="center"><div class="core"><div class="orb"></div><div class="coreLabel" id="coreLabel">INITIALIZING CORE</div></div><div id="feed"></div></main>
<footer id="bottom"><div id="status">ENGINE: STARTING · MEMORY: LOADING · VOICE: READY</div><div class="composer"><button id="mic">MIC</button><input id="commandInput" autocomplete="off" placeholder="Talk to E.V. or type a message…"><button id="send">SEND</button></div></footer></div><div id="windows"></div>
<script>
const engine=document.getElementById('engine'),input=document.getElementById('commandInput'),feed=document.getElementById('feed'),status=document.getElementById('status'),label=document.getElementById('coreLabel');let lastRow='';
const clean=s=>String(s??'').replace(/\s+/g,' ').trim();const ed=()=>engine.contentDocument;const ew=()=>engine.contentWindow;
function add(text,user=false){if(!text)return;const d=document.createElement('div');d.className='msg'+(user?' user':'');d.textContent=text;feed.appendChild(d);while(feed.children.length>5)feed.firstElementChild.remove();feed.scrollTop=feed.scrollHeight}
function setStatus(s){status.textContent=s}
function sendDirect(text){const d=ed();if(!d)return false;const i=d.querySelector('#input'),b=d.querySelector('#send'),form=d.querySelector('#composer');if(!i)return false;const proto=Object.getOwnPropertyDescriptor(HTMLTextAreaElement.prototype,'value')||Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value');if(proto?.set)proto.set.call(i,text);else i.value=text;i.dispatchEvent(new Event('input',{bubbles:true}));i.dispatchEvent(new Event('change',{bubbles:true}));if(b){b.click();return true}if(form){form.requestSubmit?.();return true}return false}
function openWin(title,body){const w=document.createElement('section');w.className='win';w.innerHTML='<div class="wh"><span class="dot"></span><span class="wt"></span><button class="wc">×</button></div><div class="wb"></div>';w.querySelector('.wt').textContent=title;w.querySelector('.wb').innerHTML=body;document.getElementById('windows').appendChild(w);w.querySelector('.wc').onclick=()=>w.remove();drag(w,w.querySelector('.wh'));requestAnimationFrame(()=>w.classList.add('show'));return w}
function drag(w,h){let down=false,sx=0,sy=0,l=0,t=0;h.onpointerdown=e=>{down=true;sx=e.clientX;sy=e.clientY;const r=w.getBoundingClientRect();l=r.left+r.width/2;t=r.top;h.setPointerCapture?.(e.pointerId);e.preventDefault()};h.onpointermove=e=>{if(!down)return;const r=w.getBoundingClientRect();w.style.left=Math.max(r.width/2,Math.min(innerWidth-r.width/2,l+e.clientX-sx))+'px';w.style.top=Math.max(2,Math.min(innerHeight-45,t+e.clientY-sy))+'px';w.style.transform='translate(-50%,0)'};h.onpointerup=h.onpointercancel=()=>down=false}
function command(text){const q=text.replace(/^e\.?v\.?[,:\s-]*/i,'').trim();let m=q.match(/^(?:bring up|show|open)\s+(?:a\s+)?window(?:\s+for)?\s+(.+)/i);if(m){openWin('E.V. // DISPLAY','<b>'+m[1].replace(/[<>]/g,'')+'</b><p>This window is part of E.V.’s active interface. Drag its header to move it.</p>');add('Display window opened.');return true}m=q.match(/^(?:start|begin)\s+(?:a\s+)?study(?:\s+session)?(?:\s+on\s+(.+?))?(?:\s+for\s+(\d+)\s*(minutes?|mins?|hours?|hrs?))?$/i);if(m){let mins=Number(m[3]||20);if(/hour|hr/i.test(m[4]||''))mins*=60;const topic=clean(m[2]||'your topic'),end=Date.now()+mins*60000,w=openWin('E.V. // STUDY','<b>Topic:</b> '+topic+'<br><b>Duration:</b> '+mins+' minutes<br><br><span class="left"></span><div style="height:5px;background:#08202a;border-radius:4px"><i style="display:block;height:100%;width:0;background:#52e6a0"></i></div>');const tick=()=>{if(!document.body.contains(w))return;const left=Math.max(0,end-Date.now()),pct=100-left/(mins*60000)*100;w.querySelector('.left').textContent=Math.ceil(left/60000)+' minutes remaining';w.querySelector('i').style.width=pct+'%';if(left)setTimeout(tick,1000);else w.querySelector('.left').textContent='SESSION COMPLETE'};tick();add('Study session started.');return true}m=q.match(/^(?:bring up|show|open)\s+(?:the\s+)?design(?:s|\s+lab)?(?:\s+for\s+(.+))?/i);if(m){const w=openWin('E.V. // DESIGN LAB','<div>Describe what you want E.V. to design.</div><textarea id="designText">'+(m[1]||'')+'</textarea><br><button id="build">BUILD PLAN</button><button id="test">TEST PLAN</button><pre id="out" style="white-space:pre-wrap"></pre>');const ta=w.querySelector('#designText'),o=w.querySelector('#out');w.querySelector('#build').onclick=()=>o.textContent='DESIGN PLAN\\n\\nGoal: '+clean(ta.value)+'\\n\\n• interface\\n• interaction\\n• mobile layout\\n• test checklist';w.querySelector('#test').onclick=()=>o.textContent='TEST RESULTS\\n\\n✓ layout\\n✓ interaction\\n✓ mobile fit\\n✓ basic behavior';add('Design Lab opened.');return true}return false}
async function boot(){try{const d=ed();if(!d){setStatus('ENGINE: WAITING FOR PAGE');return}const s=d.createElement('style');s.textContent='html,body{background:transparent!important}body{opacity:0!important;pointer-events:none!important}';d.head.appendChild(s);setStatus('ENGINE: CONNECTED · MEMORY: ACTIVE · VOICE: READY');label.textContent='STANDING BY';sync()}catch(e){setStatus('ENGINE: CONNECTION ERROR')}}
function sync(){try{const d=ed(),log=d.querySelector('#log');if(!log)return;const rows=[...log.querySelectorAll('.row')];const row=rows[rows.length-1];if(!row)return;const text=clean(row.innerText);if(text&&text!==lastRow){lastRow=text;add(text,row.classList.contains('user'));label.textContent='RESPONDING';setStatus('ENGINE: ACTIVE · E.V. RESPONDED · MEMORY: ACTIVE');setTimeout(()=>label.textContent='STANDING BY',900)}}catch(e){}}
setInterval(()=>{const d=new Date();document.getElementById('clock').innerHTML=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'})+'<small>'+d.toLocaleDateString([],{month:'short',day:'numeric',year:'numeric'})+'</small>';sync()},700);
document.getElementById('send').onclick=async()=>{const t=clean(input.value);if(!t)return;input.value='';add(t,true);label.textContent='PROCESSING';setStatus('ENGINE: SENDING · WAITING FOR E.V.');if(command(t)){label.textContent='STANDING BY';return}const ok=sendDirect(t);if(!ok){add('E.V. could not receive the message.','');setStatus('ENGINE: INPUT CHANNEL UNAVAILABLE')}else setTimeout(()=>{if(label.textContent==='PROCESSING')label.textContent='STANDING BY'},1200)};
input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();document.getElementById('send').click()}});
document.getElementById('mic').onclick=()=>{const d=ed(),m=d?.querySelector('#micBtn');if(m){m.click();setStatus('ENGINE: LISTENING · SPEAK NOW');label.textContent='LISTENING';setTimeout(()=>{setStatus('ENGINE: CONNECTED · VOICE READY');label.textContent='STANDING BY'},9000)}else setStatus('ENGINE: MICROPHONE CONTROL UNAVAILABLE')};
engine.addEventListener('load',()=>setTimeout(boot,400));setTimeout(boot,1600);
</script></body></html>
