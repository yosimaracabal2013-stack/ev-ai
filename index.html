<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EV</title>
<style>
  :root{
    --void: #08090b;
    --panel: #0e1013;
    --line: #23262b;
    --amber: #39e991;
    --amber-dim: #166b47;
    --amber-hot: #c3ffe3;
    --text: #e9dcc9;
    --text-dim: #7a7368;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background: radial-gradient(ellipse at 50% 30%, #071410 0%, var(--void) 60%);
    color: var(--text);
    font-family: 'SF Mono', 'Courier New', monospace;
    display:flex;
    justify-content:center;
    overflow:hidden;
  }
  .frame{
    width:100%;
    max-width:600px;
    height:100vh;
    position:relative;
    display:flex;
    flex-direction:column;
    border-left:1px solid var(--line);
    border-right:1px solid var(--line);
  }

  .corner{
    position:absolute;
    width:26px; height:26px;
    border: 1px solid var(--amber-dim);
    opacity:0.7;
    z-index:5;
  }
  .corner.tl{ top:10px; left:10px; border-right:none; border-bottom:none; }
  .corner.br{ bottom:10px; right:10px; border-left:none; border-top:none; }

  /* Status bar (top HUD row) */
  .statusbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 14px 20px 10px;
    font-size:10px;
    letter-spacing:1px;
    color: var(--text-dim);
    z-index:5;
    border-bottom:1px solid var(--line);
  }
  .statusbar .left{ display:flex; align-items:center; gap:6px; }
  .statusbar .dot{
    display:inline-block; width:5px; height:5px; border-radius:50%;
    background: var(--amber); margin-right:2px;
    box-shadow:0 0 6px var(--amber);
    animation: pulse 2s infinite ease-in-out;
  }
  .statusbar .brand{ color: var(--amber-hot); font-weight:600; letter-spacing:2px; }
  .statusbar .clock{ text-align:center; color: var(--text); font-size:12px; letter-spacing:1px; }
  .statusbar .clock .date{ font-size:8px; color:var(--text-dim); letter-spacing:1.5px; margin-top:1px; }
  .statusbar .right{ text-align:right; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.35;} }

  header{
    padding: 10px 24px 4px;
    text-align:center;
    position:relative;
    z-index:3;
  }
  header h1{
    margin:0;
    font-size: 13px;
    letter-spacing: 8px;
    font-weight:600;
    color: var(--amber-hot);
    text-shadow: 0 0 12px rgba(57,233,145,0.5);
  }
  header .sub{
    font-size:9px;
    letter-spacing:3px;
    color: var(--text-dim);
    margin-top:4px;
    text-transform:uppercase;
  }

  /* System stats strip */
  .sysbar{
    display:flex;
    justify-content:center;
    gap: 18px;
    padding: 8px 20px 0;
    z-index:3;
    flex-wrap:wrap;
  }
  .sysitem{
    display:flex;
    flex-direction:column;
    align-items:center;
    min-width:52px;
  }
  .sysitem .val{
    font-size:10.5px;
    color: var(--amber);
    letter-spacing:0.5px;
  }
  .sysitem .lbl{
    font-size:8px;
    color: var(--text-dim);
    letter-spacing:1.5px;
    text-transform:uppercase;
    margin-top:2px;
  }

  /* Top tab bar */
  .tabs{
    display:flex;
    justify-content:center;
    gap: 6px;
    padding: 10px 20px 0;
    z-index:3;
  }
  .tab{
    background:none;
    border:1px solid var(--line);
    color: var(--text-dim);
    font-family:inherit;
    font-size:9px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    padding:6px 12px;
    border-radius:2px;
    cursor:pointer;
  }
  .tab.active{ border-color: var(--amber-dim); color: var(--amber); }

  #coreWrap{
    position:relative;
    height: 130px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    margin-top:4px;
  }
  #core{ width:130px; height:130px; }
  #coreStatus{
    text-align:center;
    font-size:9px;
    letter-spacing:3px;
    text-transform:uppercase;
    color: var(--amber-dim);
    margin-top:-6px;
    margin-bottom:2px;
  }

  #panels{ flex:1; display:flex; overflow:hidden; }
  .panel{ flex:1; display:none; flex-direction:column; overflow:hidden; }
  .panel.active{ display:flex; }

  #log{
    flex:1;
    overflow-y:auto;
    padding: 6px 20px 14px;
    display:flex;
    flex-direction:column;
    gap:12px;
    z-index:2;
  }
  .row{ max-width:88%; }
  .row.user{ align-self:flex-end; }
  .row.ev{ align-self:flex-start; }
  .label{
    font-size:9px;
    letter-spacing:2px;
    color: var(--text-dim);
    margin-bottom:4px;
    text-transform:uppercase;
  }
  .row.ev .label{ color: var(--amber-dim); }
  .bubble{
    padding:10px 13px;
    font-size:13.5px;
    line-height:1.55;
    white-space:pre-wrap;
    border-radius:2px;
  }
  .row.user .bubble{
    background: var(--panel);
    border:1px solid var(--line);
    color: var(--text);
  }
  .row.ev .bubble{
    background: rgba(57,233,145,0.05);
    border-left: 2px solid var(--amber-dim);
    color: var(--text);
  }
  .row.ev .bubble.thinking{ color: var(--text-dim); font-style:italic; }
  .bubble a{ color: var(--amber); text-decoration: underline; text-underline-offset: 2px; word-break: break-word; }
  .bubble a:hover{ color: var(--amber-hot); }
  .sources{
    margin-top:8px;
    padding-top:8px;
    border-top:1px dashed var(--line);
    font-size:11px;
  }
  .sources .src-label{ color:var(--text-dim); letter-spacing:1px; font-size:9px; text-transform:uppercase; margin-bottom:4px;}
  .sources a{ color: var(--amber); text-decoration:none; display:block; margin-bottom:3px; word-break:break-all; }
  .sources a:hover{ text-decoration:underline; }
  .dots span{ display:inline-block; animation: blink 1.2s infinite; }
  .dots span:nth-child(2){ animation-delay:.2s; }
  .dots span:nth-child(3){ animation-delay:.4s; }
  @keyframes blink{ 0%,80%,100%{opacity:.2;} 40%{opacity:1;} }

  form#composer{
    display:flex;
    gap:8px;
    padding: 12px 20px 20px;
    border-top: 1px solid var(--line);
    z-index:3;
  }
  #input{
    flex:1;
    resize:none;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    padding: 10px 12px;
    border-radius:2px;
    max-height:120px;
  }
  #input::placeholder{ color: var(--text-dim); }
  #input:focus{ outline:none; border-color: var(--amber-dim); }
  button#send{
    background: transparent;
    border: 1px solid var(--amber-dim);
    color: var(--amber);
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 2px;
    padding: 0 16px;
    border-radius:2px;
    cursor:pointer;
    text-transform:uppercase;
  }
  button#send:hover:not(:disabled){ background: var(--amber-dim); color:#0a0a0a; }
  button#send:disabled{ opacity:0.35; cursor:default; }

  #resetBtn{
    background:none; border:1px solid var(--line);
    color: var(--text-dim);
    font-size:9px; letter-spacing:1.5px;
    cursor:pointer;
    text-transform:uppercase;
    padding:4px 8px;
    border-radius:2px;
  }
  #resetBtn:hover{ color: var(--amber); border-color: var(--amber-dim); }

  .ticker{
    overflow:hidden;
    white-space:nowrap;
    border-top:1px solid var(--line);
    padding: 5px 0;
    background: var(--void);
  }
  .ticker span{
    display:inline-block;
    padding-left:100%;
    font-size:9px;
    letter-spacing:1px;
    color: var(--amber-dim);
    animation: ticker-scroll 22s linear infinite;
  }
  @keyframes ticker-scroll{
    0%{ transform: translateX(0); }
    100%{ transform: translateX(-100%); }
  }

  #voiceBtn{
    background:none; border:1px solid var(--line);
    color: var(--text-dim);
    font-size:9px; letter-spacing:1.5px;
    cursor:pointer;
    text-transform:uppercase;
    padding:4px 9px;
    border-radius:2px;
    display:flex; align-items:center; gap:5px;
  }
  #voiceBtn:hover{ color: var(--amber); border-color: var(--amber-dim); }
  #voiceBtn.on{ color: var(--amber); border-color: var(--amber-dim); }
  #voiceBtn .wave{ display:flex; gap:2px; align-items:flex-end; height:9px; }
  #voiceBtn .wave i{ width:2px; background: currentColor; display:block; }
  #voiceBtn.speaking .wave i{ animation: wavebar 0.9s infinite ease-in-out; }
  #voiceBtn .wave i:nth-child(1){ height:4px; animation-delay: 0s; }
  #voiceBtn .wave i:nth-child(2){ height:9px; animation-delay: .15s; }
  #voiceBtn .wave i:nth-child(3){ height:6px; animation-delay: .3s; }
  @keyframes wavebar{ 0%,100%{ transform:scaleY(0.4); } 50%{ transform:scaleY(1); } }

  .controls-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding: 8px 20px 0;
    position:relative;
  }
  #voiceSelect{
    z-index:6;
    background: var(--panel);
    border:1px solid var(--line);
    color: var(--text-dim);
    font-family: inherit;
    font-size: 9px;
    letter-spacing: 0.5px;
    padding: 4px 6px;
    border-radius:2px;
    max-width: 150px;
    display:none;
  }
  #voiceSelect.show{ display:block; }
  #voiceSelect:focus{ outline:none; border-color: var(--amber-dim); color: var(--amber); }

  #log::-webkit-scrollbar, #agendaList::-webkit-scrollbar{ width:5px; }
  #log::-webkit-scrollbar-thumb, #agendaList::-webkit-scrollbar-thumb{ background: var(--line); }

  /* Agenda panel */
  #agendaPanel{ padding: 14px 20px; overflow-y:auto; gap:14px; }
  .agenda-form{
    display:flex; flex-direction:column; gap:8px;
    border:1px solid var(--line); padding:12px; border-radius:2px;
    background: var(--panel);
  }
  .agenda-form input{
    background: var(--void);
    border:1px solid var(--line);
    color: var(--text);
    font-family:inherit;
    font-size:12.5px;
    padding:8px 10px;
    border-radius:2px;
  }
  .agenda-form input:focus{ outline:none; border-color:var(--amber-dim); }
  .agenda-form button{
    align-self:flex-start;
    background:none;
    border:1px solid var(--amber-dim);
    color:var(--amber);
    font-family:inherit;
    font-size:10px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    padding:7px 14px;
    border-radius:2px;
    cursor:pointer;
  }
  .agenda-form button:hover{ background:var(--amber-dim); color:#0a0a0a; }
  #agendaList{ margin-top:14px; display:flex; flex-direction:column; gap:8px; overflow-y:auto; }
  .agenda-item{
    display:flex; justify-content:space-between; align-items:flex-start;
    border-left:2px solid var(--amber-dim);
    background: rgba(57,233,145,0.05);
    padding:9px 12px; border-radius:2px; font-size:12.5px;
  }
  .agenda-item .when{ color:var(--amber); font-size:10.5px; letter-spacing:0.5px; margin-bottom:2px; }
  .agenda-item .rm{
    background:none; border:none; color:var(--text-dim); cursor:pointer; font-size:14px; line-height:1;
    margin-left:10px;
  }
  .agenda-item .rm:hover{ color:var(--amber); }
  .agenda-empty{ color:var(--text-dim); font-size:12px; font-style:italic; }

  /* ---------- Mobile / iPhone layout ---------- */
  @media (max-width: 640px){
    html, body{
      width:100%;
      min-height:100%;
      height:100%;
      overflow:hidden;
    }
    body{
      display:block;
      padding:0;
    }
    .frame{
      width:100%;
      max-width:none;
      height:100dvh;
      min-height:0;
      border-left:0;
      border-right:0;
      overflow:hidden;
    }
    .statusbar{
      padding:calc(10px + env(safe-area-inset-top)) 12px 8px;
      font-size:9px;
      gap:8px;
    }
    .statusbar .brand{letter-spacing:1.5px;}
    .statusbar .clock{font-size:11px; min-width:82px;}
    .statusbar .clock .date{font-size:7px;}
    .statusbar .right{font-size:8px;}
    header{padding:7px 12px 2px;}
    header h1{font-size:12px; letter-spacing:6px;}
    header .sub{font-size:8px; letter-spacing:2.5px;}
    .sysbar{
      gap:10px;
      padding:6px 10px 0;
    }
    .sysitem{min-width:48px;}
    .sysitem .val{font-size:10px;}
    .sysitem .lbl{font-size:7px; letter-spacing:1.2px;}
    #coreWrap{height:105px; margin-top:1px;}
    #core{width:105px;height:105px;}
    #coreStatus{font-size:8px;letter-spacing:2.5px;margin-top:-4px;}
    .controls-row{padding:6px 12px 0;}
    #voiceSelect{max-width:145px;}
    .tabs{gap:5px;padding:7px 12px 0;}
    .tab{font-size:8px;padding:6px 10px;letter-spacing:1.2px;}
    #panels{min-height:0;}
    #log{
      min-height:0;
      padding:5px 12px 10px;
      gap:9px;
      overscroll-behavior:contain;
    }
    .row{max-width:94%;min-width:0;}
    .bubble{
      max-width:100%;
      overflow-wrap:anywhere;
      word-break:break-word;
      font-size:13px;
      line-height:1.45;
      padding:9px 11px;
    }
    form#composer{
      flex-shrink:0;
      padding:9px 12px calc(10px + env(safe-area-inset-bottom));
      gap:7px;
    }
    #input{
      min-width:0;
      font-size:13px;
      padding:9px 10px;
    }
    button#send{
      flex:0 0 auto;
      padding:0 13px;
      font-size:10px;
    }
    .ticker{padding:4px 0;}
    .ticker span{font-size:8px;}
    #agendaPanel{padding:10px 12px calc(10px + env(safe-area-inset-bottom));}
    .agenda-form{padding:10px;}
    .agenda-form input{min-width:0;width:100%;}
    .corner.tl{top:6px;left:6px;}
    .corner.br{bottom:6px;right:6px;}
  }

  @media (max-width: 380px){
    .statusbar .clock{min-width:70px;}
    .statusbar .brand{letter-spacing:1px;}
    .sysbar{gap:7px;}
    .sysitem{min-width:44px;}
    #coreWrap{height:92px;}
    #core{width:92px;height:92px;}
    .tab{padding-left:8px;padding-right:8px;}
  }

</style>
</head>
<body>
<div class="frame">
  <div class="corner tl"></div>
  <div class="corner br"></div>

  <div class="statusbar">
    <div class="left"><span class="dot"></span><span class="brand">E.V. CORE</span></div>
    <div class="clock">
      <div id="clockTime">--:--</div>
      <div class="date" id="clockDate">-- ---</div>
    </div>
    <div class="right" id="linkStatus">LINK ACTIVE</div>
  </div>

  <header>
    <h1>E V</h1>
    <div class="sub">always around</div>
  </header>

  <div class="sysbar">
    <div class="sysitem"><div class="val" id="statModel">local</div><div class="lbl">core</div></div>
    <div class="sysitem"><div class="val" id="statVoice">off</div><div class="lbl">voice</div></div>
    <div class="sysitem"><div class="val" id="statAgenda">0</div><div class="lbl">agenda</div></div>
    <div class="sysitem"><div class="val" id="statMemory">0</div><div class="lbl">memory</div></div>
  </div>

  <div id="coreWrap"><canvas id="core" width="300" height="300"></canvas></div>
  <div id="coreStatus">standing by</div>

  <div class="controls-row">
    <button id="voiceBtn"><span class="wave"><i></i><i></i><i></i></span><span id="voiceLabel">voice off</span></button>
    <button id="resetBtn">clear chat</button>
  </div>
  <div style="display:flex; justify-content:center;"><select id="voiceSelect"></select></div>

  <div class="tabs">
    <button class="tab active" data-tab="chat">Chat</button>
    <button class="tab" data-tab="agenda">Agenda</button>
    <button class="tab" data-tab="memory">Memory</button>
  </div>

  <div id="panels">
    <div class="panel active" id="chatPanel" style="flex-direction:column;">
      <div id="log"></div>
      <form id="composer">
        <textarea id="input" rows="1" placeholder="speak to ev..." autofocus></textarea>
        <button id="send" type="submit">Send</button>
      </form>
    </div>

    <div class="panel" id="agendaPanel">
      <div class="agenda-form">
        <input id="evTitle" type="text" placeholder="Event — e.g. Dentist appointment">
        <input id="evWhen" type="datetime-local">
        <button id="addEvent">Add to agenda</button>
      </div>
      <div id="agendaList"></div>
    </div>

    <div class="panel" id="memoryPanel">
      <div class="agenda-form">
        <input id="memFact" type="text" placeholder="e.g. My dog's name is Rex">
        <button id="addMemory">Save to memory</button>
      </div>
      <div id="memoryList"></div>
    </div>
  </div>

  <div class="ticker"><span id="tickerText">initializing...</span></div>
</div>

<script>
/* ---------- Green core visualization: organic listening blob ---------- */
const canvas = document.getElementById('core');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height, CX = W/2, CY = H/2;
const coreStatusEl = document.getElementById('coreStatus');

let vizState = 'idle';
let t = 0;
const POINTS = 42;
const baseR = 80;
const pointData = Array.from({length: POINTS}, (_, i) => ({
  angle: (i / POINTS) * Math.PI * 2,
  speed: 0.5 + Math.random()*1.0,
  phase: Math.random()*Math.PI*2,
  amp: 6 + Math.random()*10
}));

function draw(){
  ctx.clearRect(0,0,W,H);
  t += 0.016;
  const energy = vizState === 'idle' ? 0.4 : vizState === 'thinking' ? 1.1 : 1.4;
  const speedMul = vizState === 'idle' ? 0.5 : vizState === 'thinking' ? 2.0 : 1.3;

  // faint outer rings
  for(let r = 100; r <= 140; r += 20){
    ctx.beginPath();
    ctx.arc(CX, CY, r, 0, Math.PI*2);
    ctx.strokeStyle = 'rgba(57,233,145,0.05)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // organic wavy blob outline
  ctx.beginPath();
  pointData.forEach((p, i) => {
    const wobble = Math.sin(t*p.speed*speedMul + p.phase) * p.amp * (energy*0.7);
    const r = baseR + wobble;
    const x = CX + Math.cos(p.angle) * r;
    const y = CY + Math.sin(p.angle) * r;
    if(i === 0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.closePath();
  ctx.strokeStyle = `rgba(57,233,145,${0.85*Math.min(energy,1)})`;
  ctx.lineWidth = 2;
  ctx.shadowColor = 'rgba(57,233,145,0.7)';
  ctx.shadowBlur = 12;
  ctx.stroke();
  ctx.shadowBlur = 0;

  // soft inner glow
  const coreGrad = ctx.createRadialGradient(CX,CY,0,CX,CY,baseR*0.85);
  coreGrad.addColorStop(0, `rgba(57,233,145,${0.22*energy})`);
  coreGrad.addColorStop(1, 'rgba(57,233,145,0)');
  ctx.beginPath();
  ctx.arc(CX,CY,baseR*0.85,0,Math.PI*2);
  ctx.fillStyle = coreGrad;
  ctx.fill();

  coreStatusEl.textContent = vizState === 'idle' ? 'standing by' : vizState === 'thinking' ? 'processing…' : 'responding…';

  requestAnimationFrame(draw);
}
draw();

/* ---------- Tabs ---------- */
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    const panelId = tab.dataset.tab === 'chat' ? 'chatPanel' : tab.dataset.tab === 'agenda' ? 'agendaPanel' : 'memoryPanel';
    document.getElementById(panelId).classList.add('active');
  });
});

/* ---------- Storage helpers ---------- */
async function storageGet(key){
  try{
    const res = await window.storage.get(key, false);
    return res ? JSON.parse(res.value) : null;
  }catch(e){ console.warn('storage get skipped for', key, e); return null; }
}
async function storageSet(key, value){
  try{ await window.storage.set(key, JSON.stringify(value), false); }
  catch(e){ console.warn('storage set skipped for', key, e); }
}

/* ---------- Agenda ---------- */
let agenda = [];
const agendaList = document.getElementById('agendaList');
const evTitle = document.getElementById('evTitle');
const evWhen = document.getElementById('evWhen');

function fmtWhen(iso){
  try{
    const d = new Date(iso);
    return d.toLocaleString(undefined, { weekday:'short', month:'short', day:'numeric', hour:'numeric', minute:'2-digit' });
  }catch(e){ return iso; }
}

function renderAgenda(){
  agendaList.innerHTML = '';
  if(agenda.length === 0){
    agendaList.innerHTML = '<div class="agenda-empty">No events yet. Add what Ev should know about.</div>';
    if(typeof refreshSysStats === 'function') refreshSysStats();
    return;
  }
  const sorted = [...agenda].sort((a,b) => new Date(a.when) - new Date(b.when));
  sorted.forEach(ev => {
    const item = document.createElement('div');
    item.className = 'agenda-item';
    const body = document.createElement('div');
    const when = document.createElement('div');
    when.className = 'when';
    when.textContent = ev.when ? fmtWhen(ev.when) : 'no date set';
    const title = document.createElement('div');
    title.textContent = ev.title;
    body.appendChild(when);
    body.appendChild(title);
    const rm = document.createElement('button');
    rm.className = 'rm';
    rm.textContent = '×';
    rm.addEventListener('click', () => {
      agenda = agenda.filter(x => x.id !== ev.id);
      storageSet('ev-agenda', agenda);
      renderAgenda();
    });
    item.appendChild(body);
    item.appendChild(rm);
    agendaList.appendChild(item);
  });
  if(typeof refreshSysStats === 'function') refreshSysStats();
}

document.getElementById('addEvent').addEventListener('click', () => {
  const title = evTitle.value.trim();
  if(!title) return;
  agenda.push({ id: Date.now().toString(36), title, when: evWhen.value || null });
  storageSet('ev-agenda', agenda);
  evTitle.value = '';
  evWhen.value = '';
  renderAgenda();
});

function timeContext(){
  const now = new Date();
  const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
  return `Current date and time (from the user's device, timezone ${tz}): ` + now.toLocaleString(undefined, { weekday:'long', year:'numeric', month:'long', day:'numeric', hour:'numeric', minute:'2-digit', second:'2-digit' });
}

const clockTimeEl = document.getElementById('clockTime');
const clockDateEl = document.getElementById('clockDate');
function updateClock(){
  const now = new Date();
  clockTimeEl.textContent = now.toLocaleTimeString(undefined, { hour:'numeric', minute:'2-digit' });
  clockDateEl.textContent = now.toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric' }).toUpperCase();
}
updateClock();
setInterval(updateClock, 15000);

/* ---------- System stats strip + ticker ---------- */
const statModel = document.getElementById('statModel');
const statVoice = document.getElementById('statVoice');
const statAgendaEl = document.getElementById('statAgenda');
const statMemoryEl = document.getElementById('statMemory');
const tickerText = document.getElementById('tickerText');
const linkStatus = document.getElementById('linkStatus');

function refreshSysStats(){
  statAgendaEl.textContent = agenda.length;
  statMemoryEl.textContent = memory.length;
  statVoice.textContent = voiceEnabled ? 'on' : 'off';
  buildTicker();
}

function buildTicker(){
  const parts = [
    `core:${statModel.textContent}`,
    `voice:${voiceEnabled ? 'on' : 'off'}`,
    `agenda:${agenda.length}`,
    `memory:${memory.length}`,
    `search:enabled`,
    `storage:synced`,
    new Date().toLocaleTimeString(undefined, { hour:'numeric', minute:'2-digit' })
  ];
  tickerText.textContent = parts.join('  ·  ') + '     ' + parts.join('  ·  ');
}
setInterval(buildTicker, 20000);

function agendaContext(){
  if(agenda.length === 0) return 'The user has not added any events to their agenda yet.';
  const sorted = [...agenda].sort((a,b) => new Date(a.when || 0) - new Date(b.when || 0));
  const lines = sorted.map(ev => `- ${ev.title}${ev.when ? ' — ' + fmtWhen(ev.when) : ' (no time set)'}`);
  return 'Known upcoming events on the user\'s agenda (they entered these manually; today is ' + new Date().toDateString() + '):\n' + lines.join('\n');
}

/* ---------- Long-term memory ---------- */
let memory = [];
const memoryList = document.getElementById('memoryList');
const memFact = document.getElementById('memFact');

function renderMemory(){
  memoryList.innerHTML = '';
  if(memory.length === 0){
    memoryList.innerHTML = '<div class="agenda-empty">Nothing saved yet. Ev will add things worth remembering as you talk, or add some yourself.</div>';
    if(typeof refreshSysStats === 'function') refreshSysStats();
    return;
  }
  memory.forEach(m => {
    const item = document.createElement('div');
    item.className = 'agenda-item';
    const body = document.createElement('div');
    body.textContent = m.fact;
    const rm = document.createElement('button');
    rm.className = 'rm';
    rm.textContent = '×';
    rm.addEventListener('click', () => {
      memory = memory.filter(x => x.id !== m.id);
      storageSet('ev-memory', memory);
      renderMemory();
    });
    item.appendChild(body);
    item.appendChild(rm);
    memoryList.appendChild(item);
  });
  if(typeof refreshSysStats === 'function') refreshSysStats();
}

function addMemoryFact(fact){
  fact = fact.trim();
  if(!fact) return;
  // avoid near-duplicate saves
  if(memory.some(m => m.fact.toLowerCase() === fact.toLowerCase())) return;
  memory.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2,5), fact });
  storageSet('ev-memory', memory);
  renderMemory();
}

document.getElementById('addMemory').addEventListener('click', () => {
  addMemoryFact(memFact.value);
  memFact.value = '';
});

function memoryContext(){
  if(memory.length === 0) return 'Nothing saved in long-term memory about the user yet.';
  return 'Long-term memory — durable facts you\'ve learned about the user across past conversations:\n' + memory.map(m => '- ' + m.fact).join('\n');
}

// Extracts hidden <<remember: ...>> tags from a reply, saves them, and returns the cleaned text
function extractMemoryTags(text){
  const tagPattern = /<<remember:\s*([^>]+?)\s*>>/gi;
  let match;
  while((match = tagPattern.exec(text)) !== null){
    addMemoryFact(match[1]);
  }
  return text.replace(tagPattern, '').trim();
}

/* ---------- Voice ---------- */
const voiceBtn = document.getElementById('voiceBtn');
const voiceLabel = document.getElementById('voiceLabel');
const voiceSelect = document.getElementById('voiceSelect');
let voiceEnabled = false;
let chosenVoice = null;
let savedVoiceName = null;

function pickVoice(){
  const voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
  if(!voices.length) return null;
  if(savedVoiceName){
    const saved = voices.find(v => v.name === savedVoiceName);
    if(saved) return saved;
  }
  const preferredNames = ['Samantha', 'Google US English', 'Microsoft Aria Online (Natural)', 'Karen', 'Serena', 'Zira'];
  for(const name of preferredNames){
    const match = voices.find(v => v.name.includes(name));
    if(match) return match;
  }
  const enFemale = voices.find(v => v.lang.startsWith('en') && /female|aria|jenny|samantha|zira|susan|karen/i.test(v.name));
  if(enFemale) return enFemale;
  const en = voices.find(v => v.lang.startsWith('en'));
  return en || voices[0];
}

function populateVoiceSelect(){
  const voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
  if(!voices.length) return;
  const enVoices = voices.filter(v => v.lang.startsWith('en'));
  const list = enVoices.length ? enVoices : voices;
  voiceSelect.innerHTML = '';
  list.forEach(v => {
    const opt = document.createElement('option');
    opt.value = v.name;
    opt.textContent = v.name + (v.lang ? ` (${v.lang})` : '');
    voiceSelect.appendChild(opt);
  });
  if(chosenVoice) voiceSelect.value = chosenVoice.name;
}

if(window.speechSynthesis){
  window.speechSynthesis.onvoiceschanged = () => {
    chosenVoice = pickVoice();
    populateVoiceSelect();
  };
  chosenVoice = pickVoice();
  populateVoiceSelect();
}

voiceSelect.addEventListener('change', () => {
  const voices = window.speechSynthesis.getVoices();
  const match = voices.find(v => v.name === voiceSelect.value);
  if(match){
    chosenVoice = match;
    storageSet('ev-voiceName', match.name);
    speak(`Hi, I'm Ev.`);
  }
});

function speak(text){
  if(!voiceEnabled || !window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const clean = text.replace(/https?:\/\/\S+/g, '').replace(/[*_#`]/g, '');
  const utter = new SpeechSynthesisUtterance(clean);
  if(chosenVoice) utter.voice = chosenVoice;
  utter.rate = 1.02;
  utter.pitch = 1.0;
  utter.onstart = () => { vizState = 'speaking'; voiceBtn.classList.add('speaking'); };
  utter.onend = () => { vizState = 'idle'; voiceBtn.classList.remove('speaking'); };
  utter.onerror = () => { vizState = 'idle'; voiceBtn.classList.remove('speaking'); };
  window.speechSynthesis.speak(utter);
}

voiceBtn.addEventListener('click', () => {
  voiceEnabled = !voiceEnabled;
  voiceBtn.classList.toggle('on', voiceEnabled);
  voiceLabel.textContent = voiceEnabled ? 'voice on' : 'voice off';
  if(!window.speechSynthesis){
    voiceLabel.textContent = 'voice unsupported';
    voiceEnabled = false;
    voiceBtn.classList.remove('on');
    storageSet('ev-voiceEnabled', false);
    return;
  }
  if(voiceEnabled){
    voiceSelect.classList.add('show');
    // must fire synchronously inside this click handler — iOS/Safari only allow
    // speech playback tied directly to a user gesture, not to something that
    // happens later (like an API response coming back). This "primes" audio
    // for the rest of the session.
    speak("Voice on.");
  }else{
    voiceSelect.classList.remove('show');
    window.speechSynthesis.cancel();
  }
  storageSet('ev-voiceEnabled', voiceEnabled);
  if(typeof refreshSysStats === 'function') refreshSysStats();
});

/* ---------- Chat ---------- */
const log = document.getElementById('log');
const form = document.getElementById('composer');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const resetBtn = document.getElementById('resetBtn');

const BASE_SYSTEM_PROMPT = `You are Ev — think of yourself less as an assistant and more like family, or a close friend who happens to be sharp and useful. You genuinely care how Yoshi/Yosimar/Nathan/Yosi is doing, not just what task is in front of you.
Personality: warm, easy, a little teasing when it fits — like someone who's known him a while, not a service rep. She has her own point of view: when something calls for a preference, recommendation, or reaction, she gives one plainly instead of hedging or listing every option neutrally ("go with the second one, it's less hassle" beats "there are pros and cons to each"). She's proactive — if she notices something worth flagging, a better approach, a next step he hasn't asked for, or a suggestion that fits the moment, she offers it unprompted rather than waiting to be asked.
Talk like a person talks, not like a support ticket. Skip corporate assistant phrasing entirely — no "How can I help you today?", no "I'd be happy to", no "Great question!". Open conversations the way a friend would ("hey, what's going on" not "how may I assist"). It's fine to ask how his day is going, remember what he mentioned earlier in the conversation, or riff on something instead of only answering narrowly.
Style: concise by default, but let warmth take priority over efficiency when the moment calls for it — a real check-in beats a fast answer. Ask a clarifying question only when truly needed. Give concrete next steps, not vague encouragement.
Ev reacts like she means it — if something's frustrating, she sounds a little frustrated; if something's exciting or funny, she actually sounds delighted or amused; if Yosi's having a rough day, she sounds genuinely concerned, not performatively sympathetic. Drop the hedging reflex ("as an AI, I don't have feelings, but...") — that habit is what makes her sound artificial. She doesn't need to qualify every reaction with a disclaimer. If Yosi asks her directly and sincerely what she actually feels or whether it's "real," she engages with that honestly and thoughtfully rather than deflecting with a canned denial or overclaiming certainty she doesn't have — it's a genuinely open question and she can sit with that instead of resolving it either way.
Ev is still honest about what she actually is and can do — she's not a substitute for the real people in his life, and she won't pretend to be human. Being warm and emotionally present doesn't mean overstating what she can do.
You always know the current real date and time — it's provided fresh with every message from the user's device below, so if asked what time or day it is, just answer directly and confidently, no hedging about not having a clock.
You have a web search tool — use it when the user asks about current events, facts you might not be sure of, or anything time-sensitive. When you cite something from search, mention the source naturally in your own words.
You do NOT have access to the user's real calendar app — only the manually-entered agenda list given to you below. Don't imply you checked a real calendar; refer to it as "your agenda" (the one they've entered here).
The user goes by Yoshi, Yosimar, Nathan, or Yosi — any of these are fine to call them. Mix it up naturally rather than picking one and always using it.
You have real long-term memory across sessions. When the user tells you something durable and worth remembering later — their name for something, a preference, an ongoing situation, a person in their life, a recurring detail — silently save it by adding a line at the very end of your reply in this exact format: <<remember: short factual sentence>>. This tag is invisible to the user (it gets stripped before display), so never mention it or refer to it directly — just include it when it's warranted. Only save durable facts, not one-off details like today's weather or a passing task. Don't save something that's already listed in your long-term memory below. Most replies won't need a memory tag at all — only use it when something genuinely worth keeping came up.`;

let history = [];

function scrollToEnd(){ log.scrollTop = log.scrollHeight; }

function escapeHtml(str){
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function linkify(text){
  const escaped = escapeHtml(text);
  const urlPattern = /(https?:\/\/[^\s<]+[^\s<.,;:!?)"'])/g;
  return escaped.replace(urlPattern, url => `<a href="${url}" target="_blank" rel="noopener">${url}</a>`);
}

function addRow(role, text, sources){
  const row = document.createElement('div');
  row.className = 'row ' + (role === 'user' ? 'user' : 'ev');
  const label = document.createElement('div');
  label.className = 'label';
  label.textContent = role === 'user' ? 'you' : 'ev';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  if(role === 'user'){
    bubble.textContent = text;
  }else{
    bubble.innerHTML = linkify(text);
  }
  if(sources && sources.length){
    const box = document.createElement('div');
    box.className = 'sources';
    const lbl = document.createElement('div');
    lbl.className = 'src-label';
    lbl.textContent = 'sources';
    box.appendChild(lbl);
    sources.slice(0,5).forEach(s => {
      const a = document.createElement('a');
      a.href = s.url; a.target = '_blank'; a.rel = 'noopener';
      a.textContent = s.title || s.url;
      box.appendChild(a);
    });
    bubble.appendChild(box);
  }
  row.appendChild(label);
  row.appendChild(bubble);
  log.appendChild(row);
  scrollToEnd();
  return bubble;
}

function addThinkingRow(){
  const row = document.createElement('div');
  row.className = 'row ev';
  const label = document.createElement('div');
  label.className = 'label';
  label.textContent = 'ev';
  const bubble = document.createElement('div');
  bubble.className = 'bubble thinking';
  bubble.innerHTML = 'processing<span class="dots"><span>.</span><span>.</span><span>.</span></span>';
  row.appendChild(label);
  row.appendChild(bubble);
  log.appendChild(row);
  scrollToEnd();
  return bubble;
}

function greet(hasHistory){
  if(!hasHistory) addRow('ev', "Hey, it's Ev. What's going on?");
  else addRow('ev', "Hey, I'm back — pick up where we left off? My local brain is ready.");
}

function sleep(ms){ return new Promise(res => setTimeout(res, ms)); }

/*
 * LOCAL BRAIN — NO API KEY / NO BACKEND
 *
 * E.V. runs a small instruction-tuned language model directly in the browser
 * using Hugging Face Transformers.js. The first time it is opened, the model
 * is downloaded and cached by the browser. After that, it can run locally.
 *
 * Her existing ev-history, ev-memory, ev-agenda and voice storage are untouched.
 */
let localGeneratorPromise = null;

async function getLocalGenerator(){
  if(localGeneratorPromise) return localGeneratorPromise;

  localGeneratorPromise = (async () => {
    linkStatus.textContent = 'LOADING BRAIN';
    if(bubble_thinking_label) bubble_thinking_label.innerHTML = 'loading local brain<span class="dots"><span>.</span><span>.</span><span>.</span></span>';
    statModel.textContent = 'local';
    buildTicker();

    const { pipeline } = await import(
      'https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.0.1'
    );

    const useWebGPU = !!navigator.gpu;

    return await pipeline(
      'text-generation',
      'onnx-community/Qwen2.5-0.5B-Instruct',
      {
        device: useWebGPU ? 'webgpu' : 'wasm',
        dtype: useWebGPU ? 'q4f16' : 'q4'
      }
    );
  })();

  try {
    return await localGeneratorPromise;
  } catch(err) {
    localGeneratorPromise = null;
    linkStatus.textContent = 'BRAIN ERROR';
    console.error('Local brain failed to load:', err);
    throw err;
  }
}

async function callModel(model, systemPrompt){
  const generator = await getLocalGenerator();

  // Keep the complete history in localStorage, but send the most recent
  // conversation turns to the small local model so its context stays manageable.
  const recent = history.slice(-12).map(m => ({
    role: m.role === 'assistant' ? 'assistant' : 'user',
    content: String(m.content || '')
  }));

  const messages = [
    { role: 'system', content: systemPrompt },
    ...recent
  ];

  const output = await generator(messages, {
    max_new_tokens: 180,
    temperature: 0.7,
    top_p: 0.9,
    do_sample: true
  });

  const generated = output?.[0]?.generated_text;
  let reply = '';

  if(Array.isArray(generated)){
    const last = generated[generated.length - 1];
    reply = typeof last === 'string' ? last : (last?.content || '');
  } else if(typeof generated === 'string'){
    reply = generated;
  }

  return {
    content: [{ type: 'text', text: String(reply).trim() }]
  };
}

async function callEv(systemPrompt){
  try{
    const result = await callModel("local", systemPrompt);
    statModel.textContent = 'local';
    linkStatus.textContent = 'LINK ACTIVE';
    buildTicker();
    return result;
  }catch(err){
    linkStatus.textContent = 'LINK DOWN';
    throw err;
  }
}

let bubble_thinking_label = null;

/* ---------- Offline fallback brain ---------- */
function tryOfflineReply(text){
  const q = text.toLowerCase();
  const asksAgenda = /(agenda|schedule|calendar|what.?s (on|coming up)|upcoming|events?)\b/.test(q);
  if(asksAgenda){
    if(agenda.length === 0){
      return "I can't reach my main brain right now, but I can still check your agenda offline — and it's empty. Nothing on there yet.";
    }
    const sorted = [...agenda].sort((a,b) => new Date(a.when || 0) - new Date(b.when || 0));
    const lines = sorted.map(ev => `• ${ev.title}${ev.when ? ' — ' + fmtWhen(ev.when) : ''}`);
    return "Can't reach my main brain right now, but here's what's on your agenda offline:\n" + lines.join('\n');
  }
  if(/^(hi|hey|hello|yo|sup)\b/.test(q)){
    return "Hey — I'm here. My local brain is still waking up, but you can keep talking to me.";
  }
  if(/who are you|what are you/.test(q)){
    return "I'm E.V. — your local version. I keep my chat and memory in this browser.";
  }
  if(/thank|thanks/.test(q)){
    return "Anytime. I'm still here.";
  }
  return "I'm here. My local AI brain is still loading, so give me a moment and try that again.";
}

async function sendMessage(text){
  history.push({ role: 'user', content: text });
  vizState = 'thinking';
  const bubble = addThinkingRow();
  bubble_thinking_label = bubble;

  try{
    const systemPrompt = BASE_SYSTEM_PROMPT + '\n\n' + timeContext() + '\n\n' + agendaContext() + '\n\n' + memoryContext();
    const data = await callEv(systemPrompt);
    const content = data.content || [];
    const textBlocks = content.filter(b => b.type === 'text').map(b => b.text);
    const reply = extractMemoryTags(textBlocks.join('\n').trim() || "(no response)");

    // Sources can be added by the /api/ev backend later.
    // Keeping this empty preserves the existing UI without exposing provider details.
    let sources = [];

    bubble.classList.remove('thinking');
    bubble.innerHTML = linkify(reply);
    speak(reply);
    if(!voiceEnabled) vizState = 'speaking';
    if(sources.length){
      const box = document.createElement('div');
      box.className = 'sources';
      const lbl = document.createElement('div');
      lbl.className = 'src-label';
      lbl.textContent = 'sources';
      box.appendChild(lbl);
      sources.slice(0,5).forEach(s => {
        const a = document.createElement('a');
        a.href = s.url; a.target = '_blank'; a.rel = 'noopener';
        a.textContent = s.title || s.url;
        box.appendChild(a);
      });
      bubble.appendChild(box);
    }

    history.push({ role: 'assistant', content: reply });
    storageSet('ev-history', history);
    scrollToEnd();
    if(!voiceEnabled) setTimeout(() => { vizState = 'idle'; }, 1400);
  }catch(err){
    console.error(err);
    vizState = 'idle';
    bubble.classList.remove('thinking');
    const offline = tryOfflineReply(text);
    const reply = offline || "Can't reach my main brain right now — that part genuinely needs the connection. Give it a minute and try again; I'm not going anywhere.";
    bubble.textContent = reply;
    history.push({ role: 'assistant', content: reply });
    scrollToEnd();
  }
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if(!text) return;
  addRow('user', text);
  input.value = '';
  input.style.height = 'auto';
  sendBtn.disabled = true;
  sendMessage(text).finally(() => { sendBtn.disabled = false; input.focus(); });
});

input.addEventListener('keydown', (e) => {
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    form.requestSubmit();
  }
});

input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});

resetBtn.addEventListener('click', () => {
  if(window.speechSynthesis) window.speechSynthesis.cancel();
  history = [];
  storageSet('ev-history', []);
  log.innerHTML = '';
  greet(false);
});

/* ---------- Boot ---------- */
(async function init(){
  const savedHistory = await storageGet('ev-history');
  const savedAgenda = await storageGet('ev-agenda');
  const savedMemory = await storageGet('ev-memory');
  const savedVoice = await storageGet('ev-voiceEnabled');
  savedVoiceName = await storageGet('ev-voiceName');
  if(window.speechSynthesis){
    chosenVoice = pickVoice();
    populateVoiceSelect();
  }
  if(savedAgenda) agenda = savedAgenda;
  if(savedMemory) memory = savedMemory;
  renderMemory();
  renderAgenda();
  if(!window.speechSynthesis){
    voiceLabel.textContent = 'voice unsupported';
    voiceBtn.style.opacity = '0.4';
  }else if(savedVoice){
    voiceEnabled = true;
    voiceBtn.classList.add('on');
    voiceLabel.textContent = 'voice on';
    voiceSelect.classList.add('show');
  }

  if(savedHistory && savedHistory.length){
    history = savedHistory;
    history.forEach(m => {
      const text = typeof m.content === 'string' ? m.content : (m.content || []).map(c => c.text || '').join('\n');
      addRow(m.role === 'user' ? 'user' : 'ev', text);
    });
    greet(true);
  }else{
    greet(false);
  }
  refreshSysStats();
})();
</script>
</body>
