<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>E.V.</title>
  <style>
    html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#08090b; }
    #evFrame { display:block; width:100%; height:100%; border:0; }
  </style>
</head>
<body>
  <iframe id="evFrame" title="E.V."></iframe>
  <script>
    (async function(){
      const frame = document.getElementById('evFrame');
      try {
        const response = await fetch('./EV-New-Memory-Fixed-iPhone-Zoom-Voice-Time-Weather-Spotify-Fixed(1).html?mobilefix=1', { cache: 'no-store' });
        if(!response.ok) throw new Error('E.V. file could not be loaded (' + response.status + ')');
        let html = await response.text();

        // Fix the accidental empty async-function declaration that prevents the
        // rest of E.V.'s JavaScript from parsing.
        html = html.replace(
          /\nasync function\s*\n\/\* ---------- Jarvis-style live weather ---------- \*\//,
          '\n/* ---------- Jarvis-style live weather ---------- */'
        );

        // Force the existing E.V. layout to use the full phone width instead of
        // the 600px desktop frame that Safari was shrinking into the middle.
        html = html.replace(/max-width:600px;/g, 'max-width:none;');
        html = html.replace(
          'display:flex;\n    justify-content:center;\n    overflow:hidden;',
          'display:flex;\n    justify-content:flex-start;\n    width:100vw;\n    overflow:hidden;'
        );
        html = html.replace(
          '</style>',
          'html,body{width:100% !important;min-width:0 !important;max-width:none !important;} .frame{width:100vw !important;max-width:none !important;min-width:0 !important;}\n</style>'
        );

        // Write into same-origin about:blank so E.V. keeps its normal localStorage
        // memory and existing integrations instead of getting an opaque srcdoc origin.
        const doc = frame.contentWindow.document;
        doc.open();
        doc.write(html);
        doc.close();
      } catch (error) {
        document.body.innerHTML = '<pre style="margin:20px;color:#9ff;font:14px monospace;white-space:pre-wrap;">E.V. could not start. ' + String(error.message || error) + '</pre>';
      }
    })();
  </script>
</body>
</html>
