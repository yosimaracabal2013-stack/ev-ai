<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>E.V.</title>
  <style>html,body{margin:0;width:100%;height:100%;background:#08090b;}</style>
</head>
<body>
<script>
(async function(){
  try{
    const r=await fetch('./EV-New-Memory-Fixed-iPhone-Zoom-Voice-Time-Weather-Spotify-Fixed%281%29.html?evfix=3',{cache:'no-store'});
    if(!r.ok) throw new Error('E.V. file could not be loaded ('+r.status+')');
    let html=await r.text();
    // Fix only the two existing syntax errors; do not change E.V.'s design.
    html=html.replace(/\nasync function\s*\n\/\* ---------- Jarvis-style live weather ---------- \*\//,'\n/* ---------- Jarvis-style live weather ---------- */');
    html=html.replace(/\nasync sendMessage\(text, image\)\{/,'\nasync function sendMessage(text, image){');
    // Keep the original design while allowing it to fill an iPhone screen.
    html=html.replace(/max-width:600px;/g,'max-width:none;');
    html=html.replace('justify-content:center;\n    overflow:hidden;','justify-content:flex-start;\n    width:100vw;\n    overflow:hidden;');
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.body.innerHTML='<pre style="margin:20px;color:#9ff;font:14px monospace;white-space:pre-wrap">E.V. could not start. '+String(e.message||e)+'</pre>';
  }
})();
</script>
</body>
</html>
