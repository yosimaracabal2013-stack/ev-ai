<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#02070c">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>E.V.</title>
</head>
<body style="margin:0;background:#02070c;overflow:hidden">
<script>
(function(){
  const KEY='ev-groq-api-key';
  try{
    if(!localStorage.getItem(KEY)){
      const entered=window.prompt('E.V. needs her Groq brain key. Paste your Groq API key here. It will be stored only in this browser, not in GitHub.');
      if(entered&&entered.trim())localStorage.setItem(KEY,entered.trim());
    }
  }catch(e){ console.warn('E.V. brain setup unavailable',e); }
})();
</script>
<iframe id="evDashboard" src="./EV-Command-Dashboard.html?v=20260903-3" allow="microphone;camera;geolocation" style="display:block;width:100vw;height:100vh;border:0"></iframe>
<script src="./ev-command-runtime-fix.js?v=4"></script>
<script>
(function(){
  const frame=document.getElementById('evDashboard');
  function inject(){
    try{
      const d=frame.contentDocument;
      if(!d||!d.head)return;
      function addScript(name,src){
        if(d.querySelector('script[data-ev-src="'+name+'"]'))return;
        const s=d.createElement('script');
        s.src=src;
        s.dataset.evSrc=name;
        d.head.appendChild(s);
      }
      // Stability layer goes first so it owns the command controls and prevents
      // older dashboard handlers from swallowing the user's message.
      addScript('ev-core-stability-v3','./ev-core-stability-v3.js');
      // Companion provides movable windows and safe external-app actions.
      addScript('ev-command-companion','./ev-command-companion.js?v=4');
    }catch(e){console.warn('E.V. command layers unavailable',e)}
  }
  frame.addEventListener('load',inject);
  setTimeout(inject,900);
})();
</script>
</body>
</html>
