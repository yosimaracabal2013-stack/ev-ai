<script>
// The old E.V. brain asks for its Groq key with prompt().
// The new command interface keeps the brain in a hidden iframe, so that prompt
// could be invisible/unusable on iPhone. Ask at the top-level page instead.
(function(){
  const KEY='ev-groq-api-key';
  try{
    if(!localStorage.getItem(KEY)){
      const entered=window.prompt('E.V. needs her Groq brain key. Paste your Groq API key here. It will be stored only in this browser, not in GitHub.');
      if(entered&&entered.trim())localStorage.setItem(KEY,entered.trim());
    }
  }catch(e){ console.warn('E.V. brain setup unavailable',e); }
})();
</script>
