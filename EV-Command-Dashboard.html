<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#02070c"><title>E.V. // COMMAND CORE</title>
<style>
:root{--bg:#02070c;--panel:rgba(3,13,20,.86);--line:#0d3041;--cyan:#36d8ff;--green:#52e6a0;--dim:#628391;--text:#d8eef4}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;-webkit-text-size-adjust:100%;text-size-adjust:100%}body:before{content:"";position:fixed;inset:0;background:linear-gradient(rgba(54,216,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(54,216,255,.025) 1px,transparent 1px);background-size:48px 48px;pointer-events:none}#engine{position:fixed;left:-10000px;top:0;width:1px;height:1px;border:0;opacity:.01;pointer-events:none}#app{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom);overflow:hidden}.top{display:flex;align-items:center;justify-content:space-between;padding:12px 8px 10px;border-bottom:1px solid var(--line);min-height:58px}.brand{font-size:13px;letter-spacing:4px;color:var(--green);white-space:nowrap}.brand span{color:var(--dim);letter-spacing:2px}.clock{text-align:right;color:var(--cyan);font-size:10px;letter-spacing:1px;line-height:1.4}.clock small{display:block;color:var(--dim);font-size:8px}.main{min-height:0;position:relative;display:grid;grid-template-columns:minmax(115px,180px) minmax(180px,1fr) minmax(115px,180px);gap:10px;align-items:center;padding:12px 4px;overflow:hidden}.side{display:flex;flex-direction:column;gap:10px;min-height:0}.card{border:1px solid var(--line);background:var(--panel);padding:10px;min-height:94px;box-shadow:0 0 20px rgba(0,180,255,.035)}.card h3{margin:0 0 10px;color:var(--cyan);font-size:9px;letter-spacing:3px;font-weight:500}.card p{margin:5px 0;color:var(--dim);font-size:8px;line-height:1.6}.bar{height:5px;background:#09202b;margin:6px 0 10px}.bar i{display:block;height:100%;background:var(--cyan);width:80%;box-shadow:0 0 8px rgba(54,216,255,.35)}.coreArea{height:100%;min-height:0;display:grid;place-items:center;position:relative}.core{width:min(46vw,300px);height:min(46vw,300px);max-width:300px;max-height:300px;position:relative;display:grid;place-items:center}.ring{position:absolute;border:1px solid rgba(54,216,255,.22);border-radius:50%;inset:0;animation:spin 18s linear infinite}.ring.r2{inset:9%;border-style:dashed;animation-direction:reverse;animation-duration:24s}.ring.r3{inset:20%;animation-duration:14s}.ring:after{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 15px var(--cyan);top:8%;left:50%}.orb{width:42%;height:42%;border-radius:50%;border:2px solid var(--green);box-shadow:0 0 30px rgba(82,230,160,.2),inset 0 0 30px rgba(82,230,160,.12);animation:pulse 2.2s ease-in-out infinite;position:relative}.orb:after{content:"";position:absolute;inset:18%;border-radius:50%;background:radial-gradient(circle,rgba(82,230,160,.2),transparent 65%)}.coreLabel{position:absolute;bottom:8%;font-size:9px;letter-spacing:3px;color:var(--dim)}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{transform:scale(1.05);filter:brightness(1.25)}}.bottom{border-top:1px solid var(--line);padding:9px 0 10px;background:linear-gradient(transparent,rgba(2,7,12,.95) 20%)}.status{height:22px;text-align:center;color:var(--dim);font-size:8px;letter-spacing:2px}.status b{color:var(--cyan);font-weight:500}.composer{display:flex;gap:7px;align-items:center}.composer input{min-width:0;flex:1;height:44px;border:1px solid var(--line);background:rgba(3,13,20,.9);color:var(--text);border-radius:4px;padding:0 13px;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;outline:none}.composer input:focus{border-color:#1a657e}.btn{height:44px;border:1px solid var(--line);background:#031019;color:var(--cyan);font:9px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:2px;padding:0 12px;border-radius:4px}.btn:active{transform:scale(.98)}#feed{position:absolute;left:50%;bottom:5%;transform:translateX(-50%);width:min(72%,480px);max-height:30%;overflow:auto;display:flex;flex-direction:column;gap:7px;pointer-events:none}.msg{padding:8px 10px;border-left:2px solid var(--green);background:rgba(3,13,20,.84);font-size:10px;line-height:1.5;color:var(--text);animation:slide .35s ease}.msg.user{border-left-color:var(--cyan)}@keyframes slide{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@media(max-width:700px){#app{padding-left:8px;padding-right:8px}.main{grid-template-columns:1fr;display:block;padding:8px 0}.side{display:grid;grid-template-columns:1fr 1fr;gap:7px;position:absolute;top:8px;left:0;right:0;z-index:2}.card{min-height:70px;padding:8px}.card h3{font-size:7px;letter-spacing:2px;margin-bottom:6px}.card p{font-size:7px}.side .card:nth-child(3){display:none}.coreArea{height:100%;padding-top:105px;padding-bottom:105px}.core{width:min(64vw,285px);height:min(64vw,285px)}#feed{bottom:7%;max-height:24%;width:82%}.top{padding-left:4px;padding-right:4px}.brand{font-size:11px;letter-spacing:3px}.clock{font-size:9px}.btn{padding:0 9px}}@media(max-height:700px) and (max-width:700px){.card{min-height:58px}.coreArea{padding-top:82px;padding-bottom:88px}.core{width:min(54vw,220px);height:min(54vw,220px)}#feed{max-height:20%}}
</style></head>
<body>
<iframe id="engine" src="./EV-New-Memory-Fixed-iPhone-Zoom-Fixed-original.html?v=core70" allow="microphone;camera;geolocation"></iframe>
<div id="app"><header class="top"><div class="brand">E.V. <span>// COMMAND CORE</span></div><div class="clock" id="clock">LOCAL TIME<small>SYNCING</small></div></header><main class="main"><section class="side left"><div class="card"><h3>SYSTEM //</h3><p>CORE STATUS <b>ONLINE</b></p><div class="bar"><i style="width:92%"></i></div><p>MEMORY RECALL</p><div class="bar"><i id="memoryBar" style="width:80%"></i></div></div><div class="card"><h3>SYSTEM //</h3><p>NETWORK</p><div class="bar"><i style="width:100%"></i></div><p>SEARCH ENGINE READY</p></div></section><section class="coreArea"><div class="core"><div class="ring"></div><div class="ring r2"></div><div class="ring r3"></div><div class="orb"></div><div class="coreLabel" id="coreLabel">STANDING BY</div></div><div id="feed"></div></section><section class="side right"><div class="card"><h3>SYSTEM //</h3><p>POWER CORE</p><div class="bar"><i style="width:98%"></i></div><p>VOICE / CHAT</p><div class="bar"><i style="width:96%"></i></div></div><div class="card"><h3>SYSTEM //</h3><p>ACTIVITY</p><p id="activity">Engine starting…<br>Memory recall loading…</p></div></section></main><footer class="bottom"><div class="status">E.V. <b id="micStatus">READY</b> · LOCATION <b id="locStatus">WAITING</b> · WEATHER <b>READY</b></div><div class="composer"><button class="btn" id="mic">MIC</button><input id="commandInput" autocomplete="off" placeholder="Talk to E.V. or type a message…"><button class="btn" id="send">SEND</button></div></footer></div>
<script>
const engine=document.getElementById('engine'),input=document.getElementById('commandInput'),feed=document.getElementById('feed'),activity=document.getElementById('activity'),coreLabel=document.getElementById('coreLabel'),micStatus=document.getElementById('micStatus');
function q(s){try{return engine.contentDocument?.querySelector(s)}catch(e){return null}}function add(t,u=false){const d=document.createElement('div');d.className='msg'+(u?' user':'');d.textContent=t;feed.appendChild(d);while(feed.children.length>4)feed.firstElementChild.remove();feed.scrollTop=feed.scrollHeight}
function loadScript(d,src){return new Promise(r=>{if(d.querySelector('script[data-ev-src="'+src+'"]'))return r();const s=d.createElement('script');s.dataset.evSrc=src;s.src=src+'?v=70';s.onload=()=>r();s.onerror=()=>r();d.head.appendChild(s)})}
function installRecall(d){try{const w=d.defaultView,orig=w.fetch.bind(w);if(w.__EV_RECALL_FETCH__)return;w.fetch=async function(i,o){try{const url=typeof i==='string'?i:(i&&i.url)||'';if(url.includes('api.groq.com/openai/v1/chat/completions')&&o?.body){const b=JSON.parse(o.body);const msgs=Array.isArray(b.messages)?b.messages:null;if(msgs&&msgs[0]?.role==='system'){const archive=JSON.parse(w.localStorage.getItem('ev-conversation-archive-v1')||'[]');const mem=JSON.parse(w.localStorage.getItem('ev-core-memory-v1')||'{"facts":[],"preferences":[],"projects":[],"tasks":[]}');const query=String(msgs[msgs.length-1]?.content||'').toLowerCase();let lines=[];for(const k of ['facts','preferences','projects','tasks'])for(const x of (mem[k]||[]))lines.push('- '+String(x));const hits=[];for(const s of archive)for(const m of (s.messages||[])){const text=String(m.content||'');const low=text.toLowerCase();if(query.split(/\\W+/).filter(x=>x.length>3).some(k=>low.includes(k)))hits.push('['+(s.title||'past chat')+'] '+m.role+': '+text)}const recent=[];for(const s of archive.slice(0,8))for(const m of (s.messages||[]).slice(-4))recent.push('['+(s.title||'past chat')+'] '+m.role+': '+String(m.content||''));const recall=[...new Set([...hits.slice(-18),...recent.slice(-18)])].join('\\n');const memoryBlock='\\n\\nE.V. LONG-TERM RECALL (stored locally in this browser):\\n'+(lines.length?lines.join('\\n'):'No saved durable facts yet.')+'\\n\\nRELEVANT PAST CONVERSATIONS:\\n'+(recall||'No matching archived conversation yet.');b.messages[0].content=String(b.messages[0].content||'')+memoryBlock;o={...o,body:JSON.stringify(b)}}}}catch(e){}return orig(i,o)};w.__EV_RECALL_FETCH__=true}catch(e){}}
async function sendToEngine(text){const w=engine.contentWindow;try{if(typeof w.EVNext?.handle==='function'){const handled=await w.EVNext.handle(text);if(handled)return true}}catch(e){}try{if(typeof w.EVSend==='function'){await w.EVSend(text);return true}}catch(e){}try{if(typeof w.sendMessage==='function'){await w.sendMessage(text,null);return true}}catch(e){}const el=q('#input'),form=q('#composer');if(!el||!form)return false;el.value=text;form.requestSubmit?form.requestSubmit():form.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));return true}
async function boot(){try{const d=engine.contentDocument;const s=d.createElement('style');s.textContent='.frame{visibility:hidden!important;pointer-events:none!important}.statusbar,header,.sysbar,.tabs,.controls-row,#coreWrap,#coreStatus,#panels,form#composer,.ticker{visibility:hidden!important}body{background:transparent!important}.frame{max-width:none!important;width:1px!important;height:1px!important}';d.head.appendChild(s);await loadScript(d,'ev-memory-history-time-weather.js');await loadScript(d,'ev-upgrade-layer.js');installRecall(d);setInterval(sync,500);activity.textContent='Engine ready. Memory recall active.';document.getElementById('locStatus').textContent='AVAILABLE'}catch(e){activity.textContent='Engine connection pending.'}}
function sync(){const log=q('#log');if(!log)return;const rows=[...log.querySelectorAll('.row')];const last=rows[rows.length-1];if(!last)return;const text=last.innerText?.trim();if(text&&text!==window._last){window._last=text;add(text,last.classList.contains('user'));activity.textContent='E.V. responded. Memory recall active.';coreLabel.textContent='RESPONDING';setTimeout(()=>coreLabel.textContent='STANDING BY',900)}}
function updateClock(){const d=new Date();document.getElementById('clock').innerHTML=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'})+'<small>'+d.toLocaleDateString([],{weekday:'long',month:'long',day:'numeric',year:'numeric'})+'</small>'}setInterval(updateClock,1000);updateClock();
document.getElementById('send').onclick=async()=>{const t=input.value.trim();if(!t)return;add(t,true);input.value='';commandLabel(t);const ok=await sendToEngine(t);if(!ok)add('E.V. could not reach the main brain. Check the Groq connection.');};input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();document.getElementById('send').click()}});
function commandLabel(t){coreLabel.textContent='PROCESSING';setTimeout(()=>coreLabel.textContent='STANDING BY',1400)}
document.getElementById('mic').onclick=()=>{const m=q('#micBtn');if(m){m.click();micStatus.textContent='LISTENING';setTimeout(()=>micStatus.textContent='READY',9000)}else micStatus.textContent='UNAVAILABLE'};
engine.addEventListener('load',boot,{once:true});setTimeout(()=>{if(engine.contentDocument)boot()},1500);
</script></body></html>
