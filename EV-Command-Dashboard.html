<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#02070c">
<title>E.V. // COMMAND CORE</title>
<style>
:root{--bg:#02070c;--panel:rgba(4,15,23,.9);--line:#0d3041;--cyan:#36d8ff;--green:#52e6a0;--dim:#628391;--text:#d8eef4;--danger:#ff6b6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body:before{content:"";position:fixed;inset:0;background:linear-gradient(rgba(54,216,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(54,216,255,.025) 1px,transparent 1px);background-size:48px 48px;pointer-events:none}
#engine{position:fixed;left:-10000px;top:0;width:1px;height:1px;border:0;opacity:.01;pointer-events:none}
#app{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto;padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom);overflow:hidden}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 6px 10px;border-bottom:1px solid var(--line);min-height:56px}.brand{font-size:13px;letter-spacing:4px;color:var(--green);white-space:nowrap}.brand span{color:var(--dim);letter-spacing:2px}.clock{text-align:right;color:var(--cyan);font-size:10px;letter-spacing:1px;line-height:1.4}.clock small{display:block;color:var(--dim);font-size:8px}
.main{min-height:0;position:relative;display:grid;grid-template-columns:minmax(125px,180px) minmax(180px,1fr) minmax(125px,180px);gap:10px;align-items:center;padding:12px 4px;overflow:hidden}.side{display:flex;flex-direction:column;gap:10px;min-height:0}.card{border:1px solid var(--line);background:var(--panel);padding:10px;min-height:94px;box-shadow:0 0 20px rgba(0,180,255,.035)}.card h3{margin:0 0 9px;color:var(--cyan);font-size:9px;letter-spacing:3px;font-weight:500}.card p{margin:5px 0;color:var(--dim);font-size:8px;line-height:1.55}.bar{height:5px;background:#09202b;margin:6px 0 9px}.bar i{display:block;height:100%;background:var(--cyan);width:90%;box-shadow:0 0 8px rgba(54,216,255,.35)}
.coreArea{height:100%;min-height:0;display:grid;place-items:center;position:relative}.core{width:min(46vw,300px);height:min(46vw,300px);max-width:300px;max-height:300px;position:relative;display:grid;place-items:center}.ring{position:absolute;border:1px solid rgba(54,216,255,.22);border-radius:50%;inset:0;animation:spin 18s linear infinite}.ring.r2{inset:9%;border-style:dashed;animation-direction:reverse;animation-duration:24s}.ring.r3{inset:20%;animation-duration:14s}.ring:after{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 15px var(--cyan);top:8%;left:50%}.orb{width:42%;height:42%;border-radius:50%;border:2px solid var(--green);box-shadow:0 0 30px rgba(82,230,160,.2),inset 0 0 30px rgba(82,230,160,.12);animation:pulse 2.2s ease-in-out infinite;position:relative}.orb:after{content:"";position:absolute;inset:18%;border-radius:50%;background:radial-gradient(circle,rgba(82,230,160,.2),transparent 65%)}.coreLabel{position:absolute;bottom:8%;font-size:9px;letter-spacing:3px;color:var(--dim)}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{transform:scale(1.05);filter:brightness(1.25)}}
.bottom{border-top:1px solid var(--line);padding:8px 0 10px;background:linear-gradient(transparent,rgba(2,7,12,.97) 18%)}.status{height:22px;text-align:center;color:var(--dim);font-size:8px;letter-spacing:1.5px}.status b{color:var(--cyan);font-weight:500}.composer{display:flex;gap:7px;align-items:center}.composer input{min-width:0;flex:1;height:44px;border:1px solid var(--line);background:rgba(3,13,20,.94);color:var(--text);border-radius:4px;padding:0 13px;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;outline:none}.composer input:focus{border-color:#1a657e}.btn{height:44px;border:1px solid var(--line);background:#031019;color:var(--cyan);font:9px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:2px;padding:0 11px;border-radius:4px}.btn.active{color:var(--green);border-color:var(--green);box-shadow:0 0 14px rgba(82,230,160,.16)}
#feed{position:absolute;left:50%;bottom:5%;transform:translateX(-50%);width:min(72%,480px);max-height:30%;overflow:auto;display:flex;flex-direction:column;gap:7px;pointer-events:none}.msg{padding:8px 10px;border-left:2px solid var(--green);background:rgba(3,13,20,.88);font-size:10px;line-height:1.5;color:var(--text);animation:slide .35s ease}.msg.user{border-left-color:var(--cyan)}@keyframes slide{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#windowLayer{position:fixed;inset:0;pointer-events:none;z-index:50}.floatWindow{position:absolute;width:min(390px,calc(100vw - 24px));max-height:min(70vh,560px);background:rgba(3,12,19,.97);border:1px solid #164b60;box-shadow:0 20px 60px rgba(0,0,0,.45),0 0 28px rgba(54,216,255,.08);border-radius:8px;overflow:hidden;pointer-events:auto;animation:windowIn .42s cubic-bezier(.2,.8,.2,1);touch-action:none}.floatWindow.closing{animation:windowOut .24s ease forwards}.winHead{height:38px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,rgba(54,216,255,.06),transparent);cursor:grab;touch-action:none}.winHead:active{cursor:grabbing}.winTitle{font-size:9px;letter-spacing:2px;color:var(--cyan)}.winClose{border:0;background:none;color:var(--dim);font:14px inherit;padding:6px;cursor:pointer}.winBody{padding:12px;overflow:auto;max-height:calc(min(70vh,560px) - 38px);touch-action:pan-y}.winBody h4{margin:0 0 8px;color:var(--green);font-size:10px;letter-spacing:2px}.winBody p,.winBody li{font-size:10px;line-height:1.6;color:var(--text)}.winGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.winTile{border:1px solid var(--line);padding:10px;border-radius:6px;background:rgba(4,20,28,.75)}.winTile b{display:block;color:var(--cyan);font-size:9px;letter-spacing:1px;margin-bottom:5px}.winInput{width:100%;min-height:76px;resize:vertical;background:#02070c;border:1px solid var(--line);color:var(--text);padding:8px;font:10px inherit;border-radius:5px}.winAction{margin-top:8px;border:1px solid #19536a;background:#04131c;color:var(--cyan);padding:8px 10px;border-radius:5px;font:9px inherit;letter-spacing:1px}.timer{font-size:32px;color:var(--green);letter-spacing:3px;text-align:center;padding:16px 0}.progress{height:5px;background:#09202b;border-radius:4px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:var(--green);transition:width .4s linear}.historyItem{border-left:2px solid var(--cyan);padding:8px;margin:7px 0;background:rgba(4,20,28,.7)}.historyItem small{display:block;color:var(--dim);margin-bottom:4px}.mini{font-size:8px;color:var(--dim)}@keyframes windowIn{from{opacity:0;transform:translate(80px,18px) scale(.96)}to{opacity:1;transform:none}}@keyframes windowOut{to{opacity:0;transform:translate(80px,18px) scale(.96)}}
.compact .main{grid-template-columns:1fr}.compact .side{display:none}.compact .coreArea{min-height:0}.compact #feed{bottom:8%;max-height:28%}.compact .core{width:min(58vw,260px);height:min(58vw,260px)}
@media(max-width:700px){#app{padding-left:7px;padding-right:7px}.main{display:block;padding:8px 0}.side{display:grid;grid-template-columns:1fr 1fr;gap:7px;position:absolute;top:6px;left:0;right:0;z-index:2}.card{min-height:67px;padding:8px}.card h3{font-size:7px;letter-spacing:2px;margin-bottom:6px}.card p{font-size:7px}.side .card:nth-child(3){display:none}.coreArea{height:100%;padding-top:98px;padding-bottom:105px}.core{width:min(62vw,275px);height:min(62vw,275px)}#feed{bottom:7%;max-height:25%;width:84%}.top{padding-left:3px;padding-right:3px}.brand{font-size:11px;letter-spacing:3px}.clock{font-size:9px}.btn{padding:0 9px}.floatWindow{width:calc(100vw - 18px);max-height:68vh}.winBody{max-height:calc(68vh - 38px)}}
@media(max-height:700px) and (max-width:700px){.card{min-height:55px}.coreArea{padding-top:78px;padding-bottom:88px}.core{width:min(52vw,215px);height:min(52vw,215px)}#feed{max-height:20%}}
</style>
</head>
<body>
<iframe id="engine" src="./EV-New-Memory-Fixed-iPhone-Zoom-Fixed-original.html?v=core81" allow="microphone;camera;geolocation"></iframe>
<div id="app">
<header class="top"><div class="brand">E.V. <span>// COMMAND CORE</span></div><div class="clock" id="clock">LOCAL TIME<small>SYNCING</small></div></header>
<main class="main">
<section class="side left"><div class="card"><h3>SYSTEM //</h3><p>CORE STATUS <b>ONLINE</b></p><div class="bar"><i style="width:92%"></i></div><p>MEMORY RECALL</p><div class="bar"><i id="memoryBar" style="width:90%"></i></div></div><div class="card"><h3>SYSTEM //</h3><p>NETWORK</p><div class="bar"><i style="width:100%"></i></div><p>SEARCH ENGINE READY</p></div></section>
<section class="coreArea"><div class="core"><div class="ring"></div><div class="ring r2"></div><div class="ring r3"></div><div class="orb"></div><div class="coreLabel" id="coreLabel">STANDING BY</div></div><div id="feed"></div></section>
<section class="side right"><div class="card"><h3>SYSTEM //</h3><p>POWER CORE</p><div class="bar"><i style="width:98%"></i></div><p>VOICE / CHAT</p><div class="bar"><i id="voiceBar" style="width:96%"></i></div></div><div class="card"><h3>SYSTEM //</h3><p>ACTIVITY</p><p id="activity">Engine starting…<br>Memory recall loading…</p></div></section>
</main>
<footer class="bottom"><div class="status">E.V. <b id="micStatus">READY</b> · LOCATION <b id="locStatus">WAITING</b> · WEATHER <b>READY</b></div><div class="composer"><button class="btn" id="mic">MIC</button><input id="commandInput" autocomplete="off" placeholder="Talk to E.V. or type a message…"><button class="btn" id="send">SEND</button></div></footer>
</div>
<div id="windowLayer"></div>
<script>
const engine=document.getElementById('engine'),input=document.getElementById('commandInput'),feed=document.getElementById('feed'),activity=document.getElementById('activity'),coreLabel=document.getElementById('coreLabel'),micStatus=document.getElementById('micStatus'),windowLayer=document.getElementById('windowLayer');
let recognition=null,listening=false,restartTimer=null,z=100,studyTimer=null;
function q(s){try{return engine.contentDocument?.querySelector(s)}catch(e){return null}}
function add(t,u=false){if(!t)return;const d=document.createElement('div');d.className='msg'+(u?' user':'');d.textContent=t;feed.appendChild(d);while(feed.children.length>5)feed.firstElementChild.remove();feed.scrollTop=feed.scrollHeight}
function loadScript(d,src){return new Promise(r=>{if(d.querySelector('script[data-ev-src="'+src+'"]'))return r();const s=d.createElement('script');s.dataset.evSrc=src;s.src=src+'?v=81';s.onload=()=>r();s.onerror=()=>r();d.head.appendChild(s)})}
function installEngineSkin(d){try{const s=d.createElement('style');s.textContent='.frame{visibility:hidden!important;pointer-events:none!important}.statusbar,header,.sysbar,.tabs,.controls-row,#coreWrap,#coreStatus,#panels,form#composer,.ticker{visibility:hidden!important}body{background:transparent!important}.frame{max-width:none!important;width:1px!important;height:1px!important}';d.head.appendChild(s)}catch(e){}}
function installRecall(d){try{const w=d.defaultView,orig=w.fetch.bind(w);if(w.__EV_RECALL_FETCH__)return;w.fetch=async function(i,o){try{const url=typeof i==='string'?i:(i&&i.url)||'';if(url.includes('api.groq.com/openai/v1/chat/completions')&&o?.body){const b=JSON.parse(o.body);const msgs=Array.isArray(b.messages)?b.messages:null;if(msgs&&msgs[0]?.role==='system'){const archive=JSON.parse(w.localStorage.getItem('ev-conversation-archive-v1')||'[]');const mem=JSON.parse(w.localStorage.getItem('ev-core-memory-v1')||'{"facts":[],"preferences":[],"projects":[],"tasks":[]}');const query=String(msgs[msgs.length-1]?.content||'').toLowerCase();const lines=[];for(const k of ['facts','preferences','projects','tasks'])for(const x of (mem[k]||[]))lines.push('- '+String(x));const hits=[];for(const s of archive)for(const m of (s.messages||[])){const text=String(m.content||'');const low=text.toLowerCase();if(query.split(/\\W+/).filter(x=>x.length>3).some(k=>low.includes(k)))hits.push('['+(s.title||'past chat')+'] '+m.role+': '+text)}const recent=[];for(const s of archive.slice(0,10))for(const m of (s.messages||[]).slice(-5))recent.push('['+(s.title||'past chat')+'] '+m.role+': '+String(m.content||''));const recall=[...new Set([...hits.slice(-24),...recent.slice(-24)])].join('\\n');b.messages[0].content=String(b.messages[0].content||'')+'\\n\\nE.V. LONG-TERM RECALL:\\n'+(lines.length?lines.join('\\n'):'No durable facts saved.')+'\\n\\nRELEVANT PAST CONVERSATIONS:\\n'+(recall||'No matching archived conversation yet.');o={...o,body:JSON.stringify(b)}}}}catch(e){}return orig(i,o)};w.__EV_RECALL_FETCH__=true}catch(e){}}
async function sendToEngine(text){const w=engine.contentWindow;try{if(typeof w.EVNext?.handle==='function'){const handled=await w.EVNext.handle(text);if(handled)return true}}catch(e){}try{if(typeof w.EVSend==='function'){await w.EVSend(text);return true}}catch(e){}try{if(typeof w.sendMessage==='function'){await w.sendMessage(text,null);return true}}catch(e){}const el=q('#input'),form=q('#composer');if(!el||!form)return false;el.value=text;try{if(form.requestSubmit)form.requestSubmit();else form.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}))}catch(e){return false}return true}
function getSpeech(){return window.SpeechRecognition||window.webkitSpeechRecognition||null}
function stopListening(){listening=false;clearTimeout(restartTimer);if(recognition){try{recognition.onend=null;recognition.stop()}catch(e){}recognition=null}micStatus.textContent='READY';document.getElementById('mic').classList.remove('active');coreLabel.textContent='STANDING BY'}
function startListening(){const SR=getSpeech();if(!SR){micStatus.textContent='VOICE UNSUPPORTED';add('Voice recognition is not available in this browser.');return}if(listening)return;listening=true;micStatus.textContent='LISTENING';document.getElementById('mic').classList.add('active');coreLabel.textContent='LISTENING';let backoff=350;const make=()=>{if(!listening)return;recognition=new SR();recognition.lang='en-US';recognition.continuous=true;recognition.interimResults=true;recognition.maxAlternatives=1;recognition.onresult=e=>{let finalText='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)finalText+=t+' '}input.value=finalText.trim();if(finalText.trim()){const text=finalText.trim();input.value='';handleCommand(text,true)}};recognition.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){stopListening();add('Microphone permission is blocked. Allow microphone access for this site, then tap MIC again.')}else if(e.error!=='aborted'){micStatus.textContent='RETRYING'}};recognition.onend=()=>{if(!listening)return;clearTimeout(restartTimer);restartTimer=setTimeout(()=>{try{recognition?.start();micStatus.textContent='LISTENING';coreLabel.textContent='LISTENING';backoff=350}catch(e){backoff=Math.min(backoff*2,4000);make()}},backoff)};try{recognition.start();backoff=350}catch(e){setTimeout(make,500)}};make()}
function speak(text){try{const d=engine.contentWindow;if(typeof d.speak==='function'){d.speak(text);return}}catch(e){}if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.rate=.96;u.pitch=1.02;speechSynthesis.speak(u)}}
function commandIntent(text){return String(text).replace(/^\s*(?:hey\s+)?e\.?v\.?[,:\s-]*/i,'').trim()}
function openWindow(type,title,html,x=0,y=0){const w=document.createElement('section');w.className='floatWindow';w.style.left=Math.max(9,Math.min(innerWidth-399,innerWidth*.5-190+x))+'px';w.style.top=Math.max(68,Math.min(innerHeight-220,innerHeight*.18+y))+'px';w.style.zIndex=++z;w.innerHTML='<div class="winHead"><div class="winTitle">'+title+'</div><button class="winClose" aria-label="Close">×</button></div><div class="winBody">'+html+'</div>';windowLayer.appendChild(w);w.querySelector('.winClose').onclick=()=>{w.classList.add('closing');setTimeout(()=>w.remove(),230)};dragWindow(w,w.querySelector('.winHead'));return w}
function dragWindow(w,handle){let sx=0,sy=0,ox=0,oy=0,drag=false;handle.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;drag=true;w.style.zIndex=++z;sx=e.clientX;sy=e.clientY;ox=w.offsetLeft;oy=w.offsetTop;handle.setPointerCapture?.(e.pointerId)});handle.addEventListener('pointermove',e=>{if(!drag)return;const nx=Math.max(6,Math.min(innerWidth-w.offsetWidth-6,ox+e.clientX-sx));const ny=Math.max(58,Math.min(innerHeight-w.offsetHeight-6,oy+e.clientY-sy));w.style.left=nx+'px';w.style.top=ny+'px'});handle.addEventListener('pointerup',()=>drag=false);handle.addEventListener('pointercancel',()=>drag=false)}
function closeAllWindows(){[...windowLayer.children].forEach(w=>{w.classList.add('closing');setTimeout(()=>w.remove(),230)})}
function showStudy(minutes){const m=Math.max(1,Number(minutes)||20);if(studyTimer)clearInterval(studyTimer);const end=Date.now()+m*60000;const w=openWindow('study','STUDY SESSION // '+m+' MINUTES','<h4>FOCUS MODE</h4><div class="timer" id="studyClock">'+m+':00</div><div class="progress"><i id="studyProgress"></i></div><p>Tell E.V. what you are studying. The session stays open until the timer finishes.</p>');const tick=()=>{const left=Math.max(0,end-Date.now()),sec=Math.ceil(left/1000),mm=Math.floor(sec/60),ss=String(sec%60).padStart(2,'0');const c=w.querySelector('#studyClock'),p=w.querySelector('#studyProgress');if(c)c.textContent=mm+':'+ss;if(p)p.style.width=(100-(left/(m*60000))*100)+'%';if(left<=0){clearInterval(studyTimer);studyTimer=null;speak('Study session complete.');}};studyTimer=setInterval(tick,500);tick();}
function showDesigns(){openWindow('design','DESIGN LAB // E.V.','<h4>IDEA → TEST</h4><textarea class="winInput" id="designInput" placeholder="Tell E.V. what you want to design…"></textarea><button class="winAction" id="designTest">RUN DESIGN TEST</button><div id="designResult" class="mini" style="margin-top:10px">Ready.</div><div class="winGrid" style="margin-top:10px"><div class="winTile"><b>CONCEPT</b>Break a big idea into parts.</div><div class="winTile"><b>TEST</b>Check assumptions and show results.</div></div>');const b=windowLayer.lastElementChild;b.querySelector('#designTest').onclick=()=>{const t=b.querySelector('#designInput').value.trim();b.querySelector('#designResult').textContent=t?'Test plan created: '+t+' → assumptions, inputs, expected result, next step.':'Give me a design idea first.'}}
function showHistory(){const d=engine.contentWindow,store=(()=>{try{return JSON.parse(d.localStorage.getItem('ev-conversation-archive-v1')||'[]')}catch(e){return[]}})();let html='<h4>CONVERSATION ARCHIVE</h4>';if(!store.length)html+='<p>No archived E.V. conversations yet.</p>';else store.slice(0,30).forEach((s,i)=>{html+='<div class="historyItem"><small>'+(i+1)+' · '+new Date(s.updatedAt||Date.now()).toLocaleString()+'</small>'+String(s.title||'Conversation')+' · '+(s.messages?.length||0)+' messages</div>'});openWindow('history','MEMORY // CONVERSATION HISTORY',html)}
function showMemory(){let m={facts:[],preferences:[],projects:[],tasks:[]};try{m=JSON.parse(engine.contentWindow.localStorage.getItem('ev-core-memory-v1')||JSON.stringify(m))}catch(e){}let html='<h4>LONG-TERM MEMORY</h4>';for(const k of Object.keys(m)){html+='<div class="winTile" style="margin:7px 0"><b>'+k.toUpperCase()+'</b>'+((m[k]||[]).slice(-12).join('<br>')||'—')+'</div>'}openWindow('memory','MEMORY // LOCAL RECALL',html)}
async function showWeather(){try{if(!navigator.geolocation){openWindow('weather','WEATHER // LOCATION','<p>Your browser does not provide location access.</p>');return}navigator.geolocation.getCurrentPosition(async p=>{const u='https://api.open-meteo.com/v1/forecast?'+new URLSearchParams({latitude:p.coords.latitude,longitude:p.coords.longitude,current:'temperature_2m,apparent_temperature,weather_code,wind_speed_10m',daily:'temperature_2m_max,temperature_2m_min,precipitation_probability_max',temperature_unit:'fahrenheit',wind_speed_unit:'mph',timezone:'auto',forecast_days:'1'});const r=await fetch(u);const x=await r.json();openWindow('weather','WEATHER // EXACT LOCATION','<h4>'+new Date().toLocaleDateString()+'</h4><div class="timer">'+Math.round(x.current.temperature_2m)+'°F</div><p>Feels like '+Math.round(x.current.apparent_temperature)+'°F · Wind '+Math.round(x.current.wind_speed_10m)+' mph · Rain chance '+Math.round(x.daily.precipitation_probability_max?.[0]||0)+'%</p>')},()=>openWindow('weather','WEATHER // LOCATION','<p>Location permission is needed for exact local weather. E.V. will not request it until you ask for local weather.</p>'),{enableHighAccuracy:false,maximumAge:300000,timeout:10000})}catch(e){openWindow('weather','WEATHER // ERROR','<p>Weather lookup failed. Try again.</p>')}}
function compactMode(on){document.body.classList.toggle('compact',on);if(on){coreLabel.textContent='E.V. ACTIVE'}else coreLabel.textContent='STANDING BY'}
async function handleCommand(raw,fromVoice=false){const text=String(raw||'').trim();if(!text)return;add(text,true);const q=commandIntent(text),s=q.toLowerCase();coreLabel.textContent='PROCESSING';activity.textContent='Command received. Working…';
let m=s.match(/^start study(?: session)?(?: for)?\s+(\d+)\s*(minutes?|mins?|hours?|hrs?)?/);if(m){let mins=Number(m[1])*(/hour|hr/.test(m[2]||'')?60:1);showStudy(mins);speak('Study session started.');finish();return}
if(/^(bring up|open|show) (my )?(designs?|design lab)/.test(s)){showDesigns();speak('Design lab is up.');finish();return}
if(/^(bring up|open|show) (my )?(memory|memories)/.test(s)){showMemory();speak('Memory is up.');finish();return}
if(/^(bring up|open|show) (my )?(history|past chats|old chats|conversations)/.test(s)){showHistory();speak('Conversation history is up.');finish();return}
if(/^(bring up|open|show) (the )?(weather|local weather)/.test(s)){showWeather();speak('Weather window is up.');finish();return}
if(/^hide (everything|the interface|main interface)/.test(s)||/^compact mode/.test(s)){compactMode(true);speak('Interface minimized.');finish();return}
if(/^show interface|^restore interface|^full interface/.test(s)){compactMode(false);speak('Interface restored.');finish();return}
if(/^close (all )?windows?/.test(s)){closeAllWindows();speak('Windows closed.');finish();return}
if(/^time\??$|^what time is it\??$/.test(s)){const n=new Date();speak('It is '+n.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})+'.');finish();return}
if(/^date\??$|^what day is it\??$/.test(s)){const n=new Date();speak('Today is '+n.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'})+'.');finish();return}
const ok=await sendToEngine(text);if(!ok)add('E.V. could not reach the conversation engine. The interface is still online.');finish()}
function finish(){activity.textContent='E.V. ready. Memory recall active.';setTimeout(()=>{coreLabel.textContent='STANDING BY'},700)}
function sync(){const log=q('#log');if(!log)return;const rows=[...log.querySelectorAll('.row')];const last=rows[rows.length-1];if(!last)return;const text=last.innerText?.trim();if(text&&text!==window._lastEngine){window._lastEngine=text;add(text,last.classList.contains('user'));activity.textContent='E.V. responded. Memory recall active.';coreLabel.textContent='RESPONDING';setTimeout(()=>coreLabel.textContent='STANDING BY',900)}}
function updateClock(){const d=new Date();document.getElementById('clock').innerHTML=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'})+'<small>'+d.toLocaleDateString([],{weekday:'long',month:'long',day:'numeric',year:'numeric'})+'</small>'}setInterval(updateClock,1000);updateClock();
document.getElementById('send').onclick=()=>{const t=input.value.trim();if(!t)return;input.value='';handleCommand(t,false)};input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();document.getElementById('send').click()}});document.getElementById('mic').onclick=()=>{if(listening)stopListening();else startListening()};
async function boot(){try{const d=engine.contentDocument;installEngineSkin(d);await loadScript(d,'ev-memory-history-time-weather.js');await loadScript(d,'ev-upgrade-layer.js');installRecall(d);setInterval(sync,500);activity.textContent='Engine ready. Memory recall active.';document.getElementById('locStatus').textContent='AVAILABLE'}catch(e){activity.textContent='Engine connection pending.'}}
engine.addEventListener('load',boot,{once:true});setTimeout(()=>{if(engine.contentDocument)boot()},1200);
window.addEventListener('pagehide',()=>{try{recognition?.stop()}catch(e){}});
</script>
