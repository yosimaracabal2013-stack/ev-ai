<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>E.V.</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08090b}iframe{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe id="ev" src="./EV-New-Memory-Fixed-iPhone-Zoom-Fixed.html?v=movie-base-1" title="E.V." allow="microphone"></iframe>
<script>
'use strict';
const outer=document.getElementById('ev');
outer.addEventListener('load',()=>{try{
  const inner=outer.contentWindow.document.getElementById('evFrame');
  if(!inner)return;
  inner.addEventListener('load',()=>{try{
    const s=inner.contentDocument.createElement('script');
    s.src='./ev-movie-jarvis-layer.js?v=1';
    s.async=false;
    inner.contentDocument.body.appendChild(s);
  }catch(e){console.error('E.V. movie layer failed',e)}},{once:true});
}catch(e){console.error('E.V. movie wrapper failed',e)}});
</script>
</body>
</html>
