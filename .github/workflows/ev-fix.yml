                  linkStatus.textContent = 'RECONNECTING';
                  await sleep(attempt * 900);
                }
              }
            }
            linkStatus.textContent = 'LINK DOWN';
            throw lastErr;
          }
          '''
          new = '''async function callEv(systemPrompt){
            const maxAttempts = 4;
            let lastErr = null;
            for(let attempt = 1; attempt <= maxAttempts; attempt++){
              try{
                const result = await callModel(GROQ_MODEL, systemPrompt);
                statModel.textContent = 'gpt-oss-120b';
                linkStatus.textContent = 'LINK ACTIVE';
                buildTicker();
                return result;
              }catch(err){
                lastErr = err;
                if(err.status === 400 || err.status === 401 || err.status === 403) break;
                if(attempt < maxAttempts){
                  if(bubble_thinking_label) bubble_thinking_label.innerHTML = 'reconnecting<span class="dots"><span>.</span><span>.</span><span>.</span></span>';
                  linkStatus.textContent = 'RECONNECTING';
                  const retryMs = err.retryAfter > 0 ? Math.min(err.retryAfter * 1000, 8000) : Math.min(1000 * 2 ** (attempt - 1), 6000);
                  await sleep(retryMs);
                }
              }
            }
            linkStatus.textContent = 'LINK DOWN';
            throw lastErr;
          }
          '''
          if old not in s:
              raise SystemExit('Expected retry block not found')
          s = s.replace(old, new, 1)

          old = '''async function sendMessage(text, image){
            if(image){
          '''
          new = '''let messageInFlight = false;

          async function sendMessage(text, image){
            if(messageInFlight) return;
            messageInFlight = true;
            sendBtn.disabled = true;
            if(image){
          '''
          if old not in s:
              raise SystemExit('Expected send block not found')
          s = s.replace(old, new, 1)

          old = '''  }catch(err){
            console.error(err);
            vizState = 'idle';
            bubble.classList.remove('thinking');
            const offline = tryOfflineReply(text);
            const reply = offline || "Can't reach my main brain right now — that part genuinely needs the connection. Give it a minute and try again; I'm not going anywhere.";
            bubble.textContent = reply;
            history.push({ role: 'assistant', content: reply });
            scrollToEnd();
          }
          }
          '''
          new = '''  }catch(err){
            console.error(err);
            vizState = 'idle';
            bubble.classList.remove('thinking');
            const offline = tryOfflineReply(text);
            const detail = err?.status ? ` (connection ${err.status})` : '';
            const reply = offline || `Can't reach my main brain right now${detail}. Give it a second and try again — I'm still here.`;
            bubble.textContent = reply;
            history.push({ role: 'assistant', content: reply });
            scrollToEnd();
          }finally{
            messageInFlight = false;
            sendBtn.disabled = false;
            input.focus();
            bubble_thinking_label = null;
          }
          }
          '''
          if old not in s:
              raise SystemExit('Expected send catch block not found')
          s = s.replace(old, new, 1)

          old = '''  sendBtn.disabled = true;
            sendMessage(text, imageToSend).finally(() => { sendBtn.disabled = false; input.focus(); });
          '''
          new = '''  sendMessage(text, imageToSend);
          '''
          if old not in s:
              raise SystemExit('Expected form submit block not found')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          print('patched', p)

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add EV-New-Memory-Fixed-iPhone-Zoom-Fixed.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix E.V. multi-message chat [ev-fix]"
          git push
