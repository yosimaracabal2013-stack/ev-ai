name: Fix E.V. multi-message chat

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[ev-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch E.V.
        shell: python
        run: |
          from pathlib import Path
          p = Path('EV-New-Memory-Fixed-iPhone-Zoom-Fixed.html')
          s = p.read_text(encoding='utf-8')

          old = '''function groqMessages(systemPrompt){
            const msgs = [{ role: 'system', content: systemPrompt }];
            for(const m of history){
              if(m.role !== 'user' && m.role !== 'assistant') continue;
              if(typeof m.content === 'string'){
                msgs.push({ role: m.role, content: m.content });
                continue;
              }
              if(Array.isArray(m.content)){
                // GPT-OSS 120B on Groq expects message content to be a string here.
                // Preserve the user's text and represent attached photos as a plain note
                // instead of sending an unsupported multimodal content array.
                const parts = m.content.map(c => {
                  if(c.type === 'text') return c.text || '';
                  if(c.type === 'image' || c.type === 'image_url') return '[photo attached]';
                  return '';
                }).filter(Boolean);
                msgs.push({ role: m.role, content: parts.join('\\n') || '[attachment]' });
              }
            }
            return msgs;
          }

          async function callModel(model, systemPrompt){
            const apiKey = getGroqApiKey();
            if(!apiKey){
              throw new Error("Groq API key is missing. Add your key when E.V. asks for it.");
            }
            const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${GROQ_API_KEY}`
              },
              body: JSON.stringify({
                model: model,
                messages: groqMessages(systemPrompt),
                max_completion_tokens: 1500,
                temperature: 0.7
              })
            });
            if(!response.ok){
              const detail = await response.text().catch(() => '');
              const err = new Error((response.status >= 400 && response.status < 500 ? "Request failed: " : "Server error: ") + response.status + (detail ? " — " + detail : ""));
              err.status = response.status;
              throw err;
            }
            return await response.json();
          }
          '''

          new = '''function messageText(content){
            if(typeof content === 'string') return content;
            if(Array.isArray(content)){
              const parts = content.map(c => {
                if(c && c.type === 'text') return c.text || '';
                if(c && (c.type === 'image' || c.type === 'image_url')) return '[photo attached]';
                return '';
              }).filter(Boolean);
              return parts.join('\\n') || '[attachment]';
            }
            return '';
          }

          function groqMessages(systemPrompt){
            const msgs = [{ role: 'system', content: systemPrompt }];
            // Normalize older saved history so every request remains valid on turn 2+.
            const recent = history.slice(-24);
            for(const m of recent){
              if(m.role !== 'user' && m.role !== 'assistant') continue;
              const content = messageText(m.content).trim();
              if(!content) continue;
              const last = msgs[msgs.length - 1];
              if(last && last.role === m.role){
                last.content += '\\n' + content;
              }else{
                msgs.push({ role: m.role, content });
              }
            }
            return msgs;
          }

          async function callModel(model, systemPrompt, opts={}){
            const apiKey = getGroqApiKey();
            if(!apiKey){
              throw new Error("Groq API key is missing. Add your key when E.V. asks for it.");
            }
            const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${GROQ_API_KEY}`
              },
              body: JSON.stringify({
                model: model,
                messages: opts.messages || groqMessages(systemPrompt),
                max_completion_tokens: 1500,
                temperature: 0.7
              })
            });
            if(!response.ok){
              const detail = await response.text().catch(() => '');
              const err = new Error((response.status >= 400 && response.status < 500 ? "Request failed: " : "Server error: ") + response.status + (detail ? " — " + detail : ""));
              err.status = response.status;
              err.retryAfter = Number(response.headers.get('retry-after') || 0);
              throw err;
            }
            return await response.json();
          }
          '''
          if old not in s:
              raise SystemExit('Expected Groq block not found')
          s = s.replace(old, new, 1)

          old = '''async function callEv(systemPrompt){
            const maxAttempts = 3;
            let lastErr = null;
            for(let attempt = 1; attempt <= maxAttempts; attempt++){
              try{
                const result = await callModel(GROQ_MODEL, systemPrompt);
                statModel.textContent = 'gpt-oss-120b';
                linkStatus.textContent = 'LINK ACTIVE';
                buildTicker();
                return result;
              }catch(err){
                lastErr = err;
                if(err.status === 400 || err.status === 401 || err.status === 403) break;
                if(attempt < maxAttempts){
