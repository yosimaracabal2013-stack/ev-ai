name: Deploy E.V. to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Fix E.V. JavaScript boot syntax before publishing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('EV-New-Memory-Fixed-iPhone-Zoom-Voice-Time-Weather-Spotify-Fixed(1).html')
          s = p.read_text(encoding='utf-8')
          bad = 'async function \n/* ---------- Jarvis-style live weather ---------- */'
          good = '/* ---------- Jarvis-style live weather ---------- */'
          if bad in s:
              s = s.replace(bad, good, 1)
          else:
              import re
              s = re.sub(r'async function\\s*/\\*\\s*-{10}\\s*Jarvis-style live weather\\s*-{10}\\s*\\*/', good, s, count=1)
          p.write_text(s, encoding='utf-8')
          print('E.V. boot syntax check/fix complete')
          PY

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
