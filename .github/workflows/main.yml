name: Deploy E.V. to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Fix E.V. JavaScript boot syntax before publishing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('EV-New-Memory-Fixed-iPhone-Zoom-Voice-Time-Weather-Spotify-Fixed(1).html')
          s = p.read_text(encoding='utf-8')

          # Two accidental syntax errors in the source prevent the whole script
          # from parsing. Fix them in the published copy without changing the
          # original development file structure.
          s = re.sub(
              r'async function\\s*/\\*\\s*-{10}\\s*Jarvis-style live weather\\s*-{10}\\s*\\*/',
              '/* ---------- Jarvis-style live weather ---------- */',
              s,
              count=1,
          )
          s = s.replace('async sendMessage(text, image){', 'async function sendMessage(text, image){', 1)

          p.write_text(s, encoding='utf-8')
          print('E.V. boot syntax fixes applied')
          PY

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
