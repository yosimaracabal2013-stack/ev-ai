name: Deploy E.V. Fixed

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Patch E.V. multi-message handling
        shell: python
        run: |
          from pathlib import Path
          p = Path('EV-New-Memory-Fixed-iPhone-Zoom-Fixed.html')
          s = p.read_text(encoding='utf-8')
          patch = r'''<script>
          /* E.V. multi-turn safety patch: preserves the existing UI and bypasses the old submit path. */
          (function(){
            const form=document.getElementById('composer'), input=document.getElementById('input'), sendBtn=document.getElementById('send'), log=document.getElementById('log');
            if(!form||!input||!sendBtn||!log) return;
            let busy=false;
            function textOf(c){
              if(typeof c==='string') return c;
              if(Array.isArray(c)) return c.map(x=>x&&x.type==='text'?x.text||'':x&&(x.type==='image'||x.type==='image_url')?'[photo attached]':'').filter(Boolean).join('\\n')||'[attachment]';
              return '';
            }
            function safeMessages(systemPrompt){
              const out=[{role:'system',content:systemPrompt}];
              for(const m of history.slice(-24)){
                if(m.role!=='user'&&m.role!=='assistant') continue;
                const content=textOf(m.content).trim(); if(!content) continue;
                const last=out[out.length-1];
                if(last.role===m.role) last.content+='\\n'+content; else out.push({role:m.role,content});
              }
              return out;
            }
            async function safeCall(systemPrompt){
              const key=getGroqApiKey(); if(!key) throw new Error('Groq API key is missing');
              const res=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({model:GROQ_MODEL,messages:safeMessages(systemPrompt),max_completion_tokens:1500,temperature:.7,reasoning_effort:'low'})});
              if(!res.ok){const d=await res.text().catch(()=> ''); const e=new Error('Groq '+res.status+(d?' — '+d:'')); e.status=res.status; e.retryAfter=Number(res.headers.get('retry-after')||0); throw e;}
              return res.json();
            }
            async function safeSend(text){
              if(busy) return; busy=true; sendBtn.disabled=true; history.push({role:'user',content:text});
              const bubble=addThinkingRow();
              try{
                const ctx=BASE_SYSTEM_PROMPT+'\\n\\n'+timeContext()+'\\n\\n'+agendaContext()+'\\n\\n'+memoryContext()+'\\n\\n'+adjustmentsContext();
                let data;
                try{ data=await safeCall(ctx); }
                catch(firstErr){
                  if(firstErr&&(firstErr.status===400||firstErr.status===422)){
                    const key=getGroqApiKey();
                    const res=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({model:GROQ_MODEL,messages:[{role:'system',content:ctx},{role:'user',content:text}],max_completion_tokens:1500,temperature:.7,reasoning_effort:'low'})});
                    if(!res.ok) throw firstErr; data=await res.json();
                  }else throw firstErr;
                }
                const raw=data?.choices?.[0]?.message?.content||'(no response)';
                const reply=extractSimulationTags(extractProposalTags(extractMemoryTags(raw.trim()),log),log);
                bubble.classList.remove('thinking'); bubble.innerHTML=linkify(reply); speak(reply);
                history.push({role:'assistant',content:reply}); storageSet('ev-history',sanitizeHistoryForStorage(history)); scrollToEnd();
              }catch(err){
                console.error(err); bubble.classList.remove('thinking');
                bubble.textContent=err?.status===429?'Groq is rate-limiting E.V. for a moment. Try again in a few seconds.':'E.V. connection failed ('+(err?.status||'network')+'). Your message is still in the chat.'; scrollToEnd();
              }finally{ busy=false; sendBtn.disabled=false; input.focus(); }
            }
            form.addEventListener('submit',function(e){e.preventDefault();e.stopImmediatePropagation();const text=input.value.trim();if(!text||busy)return;addRow('user',text);input.value='';input.style.height='auto';safeSend(text);},true);
          })();
          </script>'''
          if not p.exists(): raise SystemExit('E.V. file not found')
          if 'multi-turn safety patch' not in s: p.write_text(s + '\n' + patch + '\n', encoding='utf-8')
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
