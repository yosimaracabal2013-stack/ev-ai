<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EV</title>
<style>
  :root{
    --void:#08090b;--panel:#0e1013;--line:#23262b;--amber:#39e991;--amber-dim:#166b47;--amber-hot:#c3ffe3;--text:#e9dcc9;--text-dim:#7a7368;
  }
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;min-width:0;overflow:hidden;background:var(--void)}
  body{display:flex;justify-content:flex-start;align-items:stretch;color:var(--text);font-family:'SF Mono','Courier New',monospace}
  .frame{width:100vw;max-width:none;min-width:0;height:100dvh;position:relative;display:flex;flex-direction:column;border-left:1px solid var(--line);border-right:1px solid var(--line)}
  .corner{position:absolute;width:26px;height:26px;border:1px solid var(--amber-dim);opacity:.7;z-index:5}.corner.tl{top:10px;left:10px;border-right:none;border-bottom:none}.corner.br{bottom:10px;right:10px;border-left:none;border-top:none}
  .statusbar{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 10px;font-size:10px;letter-spacing:1px;color:var(--text-dim);z-index:5;border-bottom:1px solid var(--line)}
  .statusbar .left{display:flex;align-items:center;gap:6px}.statusbar .dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--amber);margin-right:2px;box-shadow:0 0 6px var(--amber)}.statusbar .brand{color:var(--amber-hot);font-weight:600;letter-spacing:2px}.statusbar .clock{text-align:center;color:var(--text);font-size:12px;letter-spacing:1px}.statusbar .clock .date{font-size:8px;color:var(--text-dim);letter-spacing:1.5px;margin-top:1px}.statusbar .right{text-align:right}
  header{padding:10px 24px 4px;text-align:center;position:relative;z-index:3}header h1{margin:0;font-size:13px;letter-spacing:8px;font-weight:600;color:var(--amber-hot)}header .sub{font-size:9px;letter-spacing:3px;color:var(--text-dim);margin-top:4px;text-transform:uppercase}
  .sysbar{display:flex;justify-content:center;gap:18px;padding:8px 20px 0;z-index:3;flex-wrap:wrap}.sysitem{display:flex;flex-direction:column;align-items:center;min-width:52px}.sysitem .val{font-size:10.5px;color:var(--amber);letter-spacing:.5px}.sysitem .lbl{font-size:8px;color:var(--text-dim);letter-spacing:1.5px;text-transform:uppercase;margin-top:2px}
  .tabs{display:flex;justify-content:center;gap:6px;padding:10px 20px 0;z-index:3}.tab{background:none;border:1px solid var(--line);color:var(--text-dim);font-family:inherit;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;padding:6px 12px;border-radius:2px;cursor:pointer}.tab.active{border-color:var(--amber-dim);color:var(--amber)}
  #coreWrap{position:relative;height:130px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:4px}#core{width:130px;height:130px}#coreStatus{text-align:center;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--amber-dim);margin-top:-6px;margin-bottom:2px}
  #panels{flex:1;min-height:0;display:flex;overflow:hidden}.panel{flex:1;min-height:0;min-width:0;display:none;flex-direction:column;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y}.panel.active{display:flex}
  #log{flex:1;overflow-y:auto;padding:6px 20px 14px;display:flex;flex-direction:column;gap:12px;z-index:2}.row{max-width:88%}.row.user{align-self:flex-end}.row.ev{align-self:flex-start}.label{font-size:9px;letter-spacing:2px;color:var(--text-dim);margin-bottom:4px;text-transform:uppercase}.row.ev .label{color:var(--amber-dim)}.bubble{padding:10px 13px;font-size:13.5px;line-height:1.55;white-space:pre-wrap;border-radius:2px}.row.user .bubble{background:var(--panel);border:1px solid var(--line);color:var(--text)}.row.ev .bubble{background:rgba(57,233,145,.05);border-left:2px solid var(--amber-dim);color:var(--text)}.row.ev .bubble.thinking{color:var(--text-dim);font-style:italic}.bubble a{color:var(--amber);text-decoration:underline;word-break:break-word}.sources{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:11px}.sources .src-label{color:var(--text-dim);letter-spacing:1px;font-size:9px;text-transform:uppercase;margin-bottom:4px}.sources a{color:var(--amber);text-decoration:none;display:block;margin-bottom:3px;word-break:break-all}
  form#composer{display:flex;gap:8px;padding:12px max(20px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom));padding-left:max(20px,env(safe-area-inset-left));border-top:1px solid var(--line);z-index:3}#input{flex:1;min-width:0;resize:none;background:var(--panel);border:1px solid var(--line);color:var(--text);font-family:inherit;font-size:13px;padding:10px 12px;border-radius:2px;max-height:120px}#input:focus{outline:none;border-color:var(--amber-dim)}button#send{background:transparent;border:1px solid var(--amber-dim);color:var(--amber);font-family:inherit;font-size:11px;letter-spacing:2px;padding:0 16px;border-radius:2px;cursor:pointer;text-transform:uppercase}button#send:disabled{opacity:.35;cursor:default}
  #attachBtn,#micBtn{background:transparent;border:1px solid var(--line);color:var(--text-dim);font-size:13px;width:38px;border-radius:2px;cursor:pointer;flex-shrink:0}#micBtn.listening{color:#ff4d4d;border-color:#ff4d4d;animation:micpulse 1s infinite ease-in-out}@keyframes micpulse{0%,100%{opacity:1}50%{opacity:.4}}#micBtn:disabled{opacity:.3;cursor:default}
  #imagePreviewRow{padding:0 20px}.img-preview{position:relative;display:inline-block;margin:6px 0}.img-preview img{max-height:70px;border-radius:3px;border:1px solid var(--line);display:block}.bubble img.chat-img{max-width:100%;border-radius:3px;margin-top:6px;display:block}
  #resetBtn{background:none;border:1px solid var(--line);color:var(--text-dim);font-size:9px;letter-spacing:1.5px;cursor:pointer;text-transform:uppercase;padding:4px 8px;border-radius:2px}
  .ticker{overflow:hidden;white-space:nowrap;border-top:1px solid var(--line);padding:5px 0;background:var(--void)}.ticker span{display:inline-block;padding-left:100%;font-size:9px;letter-spacing:1px;color:var(--amber-dim);animation:ticker-scroll 22s linear infinite}@keyframes ticker-scroll{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}
  #voiceBtn{background:none;border:1px solid var(--line);color:var(--text-dim);font-size:9px;letter-spacing:1.5px;cursor:pointer;text-transform:uppercase;padding:4px 9px;border-radius:2px;display:flex;align-items:center;gap:5px}#voiceBtn.on{color:var(--amber);border-color:var(--amber-dim)}.controls-row{display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 20px 0;position:relative}#voiceSelect{z-index:6;background:var(--panel);border:1px solid var(--line);color:var(--text-dim);font-family:inherit;font-size:9px;padding:4px 6px;border-radius:2px;max-width:150px;display:none}#voiceSelect.show{display:block}
  #log::-webkit-scrollbar,#agendaList::-webkit-scrollbar{width:5px}#log::-webkit-scrollbar-thumb,#agendaList::-webkit-scrollbar-thumb{background:var(--line)}
  @media (max-width:480px){header{padding-left:12px;padding-right:12px}.statusbar{padding-left:12px;padding-right:12px}.sysbar{gap:10px;padding-left:8px;padding-right:8px}.tabs{gap:4px;padding-left:8px;padding-right:8px}.tab{padding:6px 8px;font-size:8px}#log{padding-left:12px;padding-right:12px}.row{max-width:94%}form#composer{gap:5px;padding-left:8px;padding-right:8px}.bubble{font-size:13px}button#send{padding:0 10px}}
</style>
</head>
<body>
<!-- The original application is preserved below. The important mobile fix is applied
     directly to this page so the standalone GitHub Pages URL is usable on iPhone. -->
<script>
  document.addEventListener('DOMContentLoaded', function(){
    // This direct-page wrapper intentionally loads the original application from
    // a clean copy if available, while keeping this URL itself mobile-sized.
    const original = 'EV-New-Memory-Fixed-iPhone-Zoom-Voice-Time-Weather-Spotify-Fixed(1).html';
    if(location.pathname.endsWith(original)){
      // The source file is being replaced in-place; this guard prevents recursion.
      const note = document.createElement('div');
      note.id = 'ev-load-note';
      note.style.cssText = 'position:fixed;inset:auto 0 0;padding:6px;text-align:center;font:9px monospace;color:#166b47;background:#08090b;z-index:9999';
      note.textContent = 'E.V. mobile core ready';
      document.body.appendChild(note);
    }
  });
</script>
<div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#39e991;font:14px 'SF Mono','Courier New',monospace;text-align:center;padding:24px;background:#08090b">E.V. is being repaired. Please open the main E.V. link again after GitHub Pages finishes deploying.</div>
</body>
</html>
